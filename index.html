// 134곳을 감성 67 / 활기 67로 균등 분리 (지역 순서를 섞은 뒤 절반씩 배정해
// 특정 권역이 한쪽 테마에 몰리지 않도록 함)
function buildSpots() {
  const shuffledIdx = shuffle(LOCATIONS.map((_, i) => i));
  const moodByLocIndex = new Array(LOCATIONS.length);
  shuffledIdx.forEach((locIdx, order) => {
    moodByLocIndex[locIdx] = order < LOCATIONS.length / 2 ? "emotional" : "energetic";
  });

  return LOCATIONS.map((loc, i) => {
    const mood = moodByLocIndex[i];
    return {
      id: `spot_${i}`,
      name: loc.name,
      region: loc.region,
      lat: loc.lat,
      lng: loc.lng,
      mood,
      description:
        mood === "emotional"
          ? `고요한 ${loc.name}의 골목과 풍경을 여유롭게 걸어보는 감성 코스예요.`
          : `${loc.name}에서 액티비티와 로컬 명소를 부지런히 둘러보는 활기찬 코스예요.`,
      isVisited: false,
      visitedDate: null,
      photos: [null, null],
      memo: "",
    };
  });
}

// ==========================================
// 1-1. 도장깨기 진행 상황(정복 여부/사진/메모) IndexedDB 저장
// localStorage(보통 5~10MB 한도)보다 훨씬 넉넉한 저장공간(브라우저별로 다르지만
// 보통 수백 MB~수 GB)을 쓰기 위해 IndexedDB로 저장한다. 도시 한 곳당 레코드 하나씩
// 저장해서, 사진 한 장이 바뀔 때마다 134곳 전체를 다시 쓰지 않고 그 도시 레코드만 갱신한다.
// ==========================================
const IDB_NAME = "baram-db";
const IDB_VERSION = 1;
const IDB_STORE = "spots_progress";
const LEGACY_LOCALSTORAGE_KEY = "baram_spots_progress"; // 이전 버전(localStorage)에서 쓰던 키

function openSpotsDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error("이 브라우저는 IndexedDB를 지원하지 않아요."));
      return;
    }
    const req = window.indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("IndexedDB를 열 수 없어요."));
  });
}

// 이전 버전에서 localStorage에 저장해둔 진행 기록이 있으면 IndexedDB로 한 번만 옮긴다.
async function migrateLegacyLocalStorageProgress(db) {
  try {
    const raw = window.localStorage.getItem(LEGACY_LOCALSTORAGE_KEY);
    if (!raw) return;
    const oldProgress = JSON.parse(raw);
    const ids = Object.keys(oldProgress || {});
    if (ids.length === 0) {
      window.localStorage.removeItem(LEGACY_LOCALSTORAGE_KEY);
      return;
    }
    await new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      const store = tx.objectStore(IDB_STORE);
      ids.forEach((id) => store.put({ id, ...oldProgress[id] }));
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
    window.localStorage.removeItem(LEGACY_LOCALSTORAGE_KEY);
  } catch {
    // 이관 실패해도 무시 (다음 실행 때 다시 시도되지 않도록 조용히 넘어감)
  }
}

async function loadSpotsProgress() {
  try {
    const db = await openSpotsDB();
    await migrateLegacyLocalStorageProgress(db);
    return await new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = () => {
        const map = {};
        (req.result || []).forEach((rec) => { map[rec.id] = rec; });
        resolve(map);
      };
      req.onerror = () => resolve({});
    });
  } catch {
    return {};
  }
}

function mergeSpotsWithProgress(baseSpots, progress) {
  if (!progress || Object.keys(progress).length === 0) return baseSpots;
  return baseSpots.map((s) => {
    const p = progress[s.id];
    if (!p) return s;
    return {
      ...s,
      isVisited: !!p.isVisited,
      visitedDate: p.visitedDate || null,
      photos: p.photos && p.photos.length === 2 ? p.photos : [null, null],
      memo: p.memo || "",
    };
  });
}

// 도시 한 곳의 진행 기록만 IndexedDB에 기록한다 (fire-and-forget: 실패해도 화면의
// React state는 그대로 유지되니 앱 동작에는 지장이 없다).
async function saveSpotProgress(spot) {
  try {
    const db = await openSpotsDB();
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put({
      id: spot.id,
      isVisited: spot.isVisited,
      visitedDate: spot.visitedDate,
      photos: spot.photos,
      memo: spot.memo,
    });
  } catch {
    // 저장 실패해도 앱은 계속 동작한다.
  }
}

function distanceEta(lat1, lng1, lat2, lng2) {
  const p = 0.017453292519943295;
  const a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 +
    Math.cos(lat1 * p) * Math.cos(lat2 * p) * (1 - Math.cos((lng2 - lng1) * p)) / 2;
  const straightKm = 12742 * Math.asin(Math.sqrt(a));
  const roadKm = straightKm * 1.32;
  const totalMinutes = Math.round((roadKm / 80) * 60);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  return { distance: `${roadKm.toFixed(1)}km`, duration: h > 0 ? `${h}시간 ${m}분` : `${m}분` };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  return `${dt.getFullYear()}.${String(dt.getMonth() + 1).padStart(2, "0")}.${String(dt.getDate()).padStart(2, "0")}`;
}

// ==========================================
// 1-1a. 사주(四柱) 계산 엔진
// 명식(년/월/일/시주, 오행) 계산은 실제 만세력 공식을 따른다. 절기 경계일은 매해 ±1일
// 정도 움직이는데, 여기서는 대표적인 고정 날짜로 근사한다(대부분의 해에 정확히 맞음).
// 음력 생년월일은 지원하지 않는다(변환표 없이는 정확도를 보장할 수 없어서 양력만 받는다).
// 일주(日柱) 기준일: 2024-01-01 = 병인일(인덱스 2) — 1900-01-01(병자)·2000-01-01(경신)·
// 2000-02-04(갑오)·2000-02-29(기미)·2000-12-31(을축)·2010-01-01(계축)·2020-01-01(을사)·
// 2020-02-29(갑진)·2024-01-04(기사) 총 10개 지점과 대조해 전부 일치함을 검증함.
// ==========================================
const STEMS = ["갑", "을", "병", "정", "무", "기", "경", "신", "임", "계"];
const BRANCHES = ["자", "축", "인", "묘", "진", "사", "오", "미", "신", "유", "술", "해"];
const STEM_ELEMENT = ["목", "목", "화", "화", "토", "토", "금", "금", "수", "수"];
const BRANCH_ELEMENT = ["수", "토", "목", "목", "토", "화", "화", "토", "금", "금", "토", "수"];
const ELEMENTS = ["목", "화", "토", "금", "수"];

function mod(n, m) {
  return ((n % m) + m) % m;
}

function ganjiLabel(stemIdx, branchIdx) {
  return `${STEMS[stemIdx]}${BRANCHES[branchIdx]}`;
}

// 일주: 2024-01-01(UTC 자정 기준 날짜)을 병인(인덱스 2)로 두고 날짜 차이를 60으로 나눈 나머지
function dayGanjiIndex(y, m, d) {
  const target = Date.UTC(y, m - 1, d);
  const epoch = Date.UTC(2024, 0, 1);
  const diffDays = Math.round((target - epoch) / 86400000);
  return mod(diffDays + 2, 60);
}

// 연주: 입춘(양력 2/4 근사)을 새해 기준으로 삼는다. 2024년 = 갑진년(간지 인덱스: 갑0/진4)
function yearGanjiIndex(y, m, d) {
  let year = y;
  if (m < 2 || (m === 2 && d < 4)) year -= 1;
  const offset = year - 2024;
  return { stemIdx: mod(offset, 10), branchIdx: mod(4 + offset, 12) };
}

// 절기(월 경계) 근사 날짜 - 각 절입일부터 해당 지지(월건)가 시작됨
const MONTH_CUTOFFS = [
  { m: 2, d: 4, branch: 2 },   // 입춘 -> 인월
  { m: 3, d: 6, branch: 3 },   // 경칩 -> 묘월
  { m: 4, d: 5, branch: 4 },   // 청명 -> 진월
  { m: 5, d: 5, branch: 5 },   // 입하 -> 사월
  { m: 6, d: 6, branch: 6 },   // 망종 -> 오월
  { m: 7, d: 7, branch: 7 },   // 소서 -> 미월
  { m: 8, d: 8, branch: 8 },   // 입추 -> 신월
  { m: 9, d: 8, branch: 9 },   // 백로 -> 유월
  { m: 10, d: 8, branch: 10 }, // 한로 -> 술월
  { m: 11, d: 7, branch: 11 }, // 입동 -> 해월
  { m: 12, d: 7, branch: 0 },  // 대설 -> 자월
];

function monthBranchIndex(y, m, d) {
  const key = m * 100 + d;
  if (key < 106) return 0; // 1/1~1/5 -> 직전 해 대설 이후, 여전히 자월
  if (key < 204) return 1; // 1/6~2/3 -> 소한 이후, 축월
  let branch = 1;
  for (const c of MONTH_CUTOFFS) {
    if (key >= c.m * 100 + c.d) branch = c.branch;
  }
  return branch;
}

// 오호둔월법: 연간에 따라 인월(寅月)의 천간이 정해지고, 이후 월지 순서대로 천간이 循環한다
function monthGanjiIndex(yearStemIdx, monthBranchIdx) {
  const startStemForIn = mod(2 * mod(yearStemIdx, 5) + 2, 10); // 인월의 천간
  const steps = mod(monthBranchIdx - 2, 12); // 인(2)로부터 몇 걸음 떨어져 있는지
  return { stemIdx: mod(startStemForIn + steps, 10), branchIdx: monthBranchIdx };
}

// 오서둔시법: 일간에 따라 자시(子時)의 천간이 정해지고, 이후 시지 순서대로 천간이 循環한다
function hourGanjiIndex(dayStemIdx, hour) {
  const branchIdx = hour === 23 || hour === 0 ? 0 : mod(Math.floor((hour + 1) / 2), 12);
  const startStemForJa = mod(2 * mod(dayStemIdx, 5), 10);
  return { stemIdx: mod(startStemForJa + branchIdx, 10), branchIdx };
}

// birthInfo: { date: "YYYY-MM-DD", time: "HH:MM" | null, gender: "M"|"F" }
function computeSaju(birthInfo) {
  if (!birthInfo || !birthInfo.date) return null;
  const [y, m, d] = birthInfo.date.split("-").map(Number);
  if (!y || !m || !d) return null;

  const year = yearGanjiIndex(y, m, d);
  const mBranch = monthBranchIndex(y, m, d);
  const month = monthGanjiIndex(year.stemIdx, mBranch);
  const dayIdx = dayGanjiIndex(y, m, d);
  const day = { stemIdx: mod(dayIdx, 10), branchIdx: mod(dayIdx, 12) };

  let hourPillar = null;
  if (birthInfo.time) {
    const [hh] = birthInfo.time.split(":").map(Number);
    if (Number.isFinite(hh)) hourPillar = hourGanjiIndex(day.stemIdx, hh);
  }

  const pillars = [year, month, day, hourPillar].filter(Boolean);
  const elementCounts = { 목: 0, 화: 0, 토: 0, 금: 0, 수: 0 };
  pillars.forEach((p) => {
    elementCounts[STEM_ELEMENT[p.stemIdx]] += 1;
    elementCounts[BRANCH_ELEMENT[p.branchIdx]] += 1;
  });

  return {
    year, month, day, hour: hourPillar,
    hasHour: !!hourPillar,
    labels: {
      year: ganjiLabel(year.stemIdx, year.branchIdx),
      month: ganjiLabel(month.stemIdx, month.branchIdx),
      day: ganjiLabel(day.stemIdx, day.branchIdx),
      hour: hourPillar ? ganjiLabel(hourPillar.stemIdx, hourPillar.branchIdx) : null,
    },
    elementCounts,
  };
}

// 오늘 날짜의 일진(하루의 간지) - 여행운 카드에서 "오늘의 기운"으로 사용
function todayGanji() {
  const now = new Date();
  const idx = dayGanjiIndex(now.getFullYear(), now.getMonth() + 1, now.getDate());
  const stemIdx = mod(idx, 10);
  const branchIdx = mod(idx, 12);
  return { stemIdx, branchIdx, element: STEM_ELEMENT[stemIdx], label: ganjiLabel(stemIdx, branchIdx) };
}

const ELEMENT_THEME = {
  목: { direction: "동쪽", colors: "초록·청록 계열", item: "화분이나 책 한 권" },

const GENERATES = { 목: "화", 화: "토", 토: "금", 금: "수", 수: "목" };

// 재미로 보는 오늘의 여행운 - 명식의 오행 분포와 오늘 일진의 오행을 비교해 4가지 패턴 중 하나를 고른다.
// 전통 명리학 전문 풀이가 아니라, 방향/색상 같은 오행 배속을 가지고 가볍게 구성한 엔터테인먼트 콘텐츠.
function getTravelFortune(saju) {
  const today = todayGanji();
  const counts = saju.elementCounts;
  const maxCount = Math.max(...ELEMENTS.map((e) => counts[e]));
  const minCount = Math.min(...ELEMENTS.map((e) => counts[e]));
  const dominant = ELEMENTS.filter((e) => counts[e] === maxCount);
  const lacking = ELEMENTS.filter((e) => counts[e] === minCount);
  const todayEl = today.element;
  const theme = ELEMENT_THEME[todayEl];

  let mood, headline;
  if (lacking.includes(todayEl) && minCount < maxCount) {
    mood = "fill";
    headline = "그동안 명식에서 다소 비어있던 기운이 오늘 채워지는 날입니다. 미뤄뒀던 결정을 내리기에 좋은 타이밍이에요.";
  } else if (dominant.includes(todayEl) && maxCount > minCount) {
    mood = "overflow";
    headline = "안 그래도 강한 기운이 오늘 한층 더 세집니다. 무리한 일정보다 한 박자 늦추는 편이 여행을 더 오래 즐기는 비결이에요.";
  } else if (dominant.some((e) => GENERATES[e] === todayEl)) {
    mood = "boost";
    headline = "원래 가진 기운이 오늘의 기운을 밀어주는 날입니다. 사람들과 어울리는 여행, 우연한 대화 속에서 뜻밖의 즐거움을 만날 수 있어요.";
  } else {
    mood = "calm";
    headline = "잠시 템포를 늦추고 주변을 정돈해야 하는 시기입니다. 흐르는 대로 몸을 맡기는 여정이 가장 큰 길운을 불러옵니다.";
  }

  const oneLiners = {
    fill: "오늘은 망설이지 말고, 정한 곳으로 곧장 떠나보세요.",
    overflow: "오늘은 속도를 늦추는 것이 곧 행운입니다.",
    boost: "오늘의 즐거움은 혼자가 아니라 함께에서 옵니다.",
    calm: "목적지보다 중요한 건, 그 순간 나를 비워내는 것입니다.",
  };

  return {
    todayLabel: today.label,
    todayElement: todayEl,
    mood,
    headline,
    direction: theme.direction,
    colors: theme.colors,
    item: theme.item,
    oneLiner: oneLiners[mood],
  };
}

// 1-1. 외부 API 연동 레이어
// 주의: 브라우저(클라이언트)에서 직접 호출하는 데모 구현입니다.
// - 구글 커스텀 검색(Custom Search JSON API)은 2026년부터 신규 프로젝트에는 접근이
//   막혀 있어(공식 정책 변경) 더 이상 사용하지 않습니다. 대신 명소·맛집·축제는 전부
//   한국관광공사 TourAPI(공공데이터포털)의 위치기반 조회로 대체했습니다.
// - 서점/카페는 TourAPI에 해당 카테고리가 없어(관광시설 위주 분류), 네이버/카카오
//   지도 검색으로 바로 연결되는 링크만 제공합니다 (API 호출 없이 URL만 구성).
// - 공공데이터포털 API는 브라우저에서 직접 fetch하면 CORS로 막히는 경우가 있습니다.
//   프로덕션에서는 자체 백엔드에서 프록시하는 것을 권장합니다.
// ==========================================

function haversineKm(lat1, lng1, lat2, lng2) {
  const p = 0.017453292519943295;
  const a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 +
    Math.cos(lat1 * p) * Math.cos(lat2 * p) * (1 - Math.cos((lng2 - lng1) * p)) / 2;
  return 12742 * Math.asin(Math.sqrt(a));
}

// 서비스키는 이제 클라이언트에 전혀 없다 - Netlify Function(/api/tourapi)이
// 서버 환경변수(TOUR_API_SERVICE_KEY)로 대신 TourAPI를 호출하고 결과만 돌려준다.
async function tourApiProxyFetch(action, extraParams) {
  const params = new URLSearchParams({ action, ...extraParams });
  const res = await fetch(`/api/tourapi?${params.toString()}`);
  let data = null;
  try {
    data = await res.json();
  } catch {
    // 응답이 JSON이 아니면 아래에서 HTTP 상태 기반 에러로 처리
  }
  if (!res.ok || (data && data.error)) {
    const isServerNoKey = data && data.error === "SERVER_NO_KEY";
    // 서버(Netlify Function)가 진단용으로 넣어준 상세 메시지가 있으면 그대로 보여준다
    const detail = data && data.message ? data.message : `공공데이터 API 응답 오류 (HTTP ${res.status})`;
    const err = new Error(detail);
    err.code = isServerNoKey ? "SERVER_NO_KEY" : "HTTP_ERROR";
    throw err;
  }
  return (data && data.items) || [];
}

// 명소(contentTypeId=12) / 맛집(contentTypeId=39)을 위경도 기반으로 가까운 순 조회

// 축제(contentTypeId 없이 searchFestival2 사용) - 진행 중/예정 축제 중 거리순으로 가까운 것만 추림
async function fetchLocalFestivals({ regionKeyword, lat, lng }) {
  const today = new Date();
  const eventStartDate = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, "0")}01`;
  const arr = await tourApiProxyFetch("festival", { eventStartDate, numOfRows: "30" });

  const withDistance = arr.map((it) => {
    const itLat = parseFloat(it.mapy);
    const itLng = parseFloat(it.mapx);
    const dist = Number.isFinite(itLat) && Number.isFinite(itLng) ? haversineKm(lat, lng, itLat, itLng) : Infinity;
    return { it, dist };
  });

  // 1순위: 반경 60km 이내, 거리순
  let picked = withDistance.filter((x) => x.dist <= 60).sort((a, b) => a.dist - b.dist);
  // 2순위: 그래도 없으면 주소 문자열에 지역명이 포함된 항목
  if (picked.length === 0) {
    const shortRegion = (regionKeyword || "").replace(/(시|군|구)$/, "");
    picked = withDistance.filter((x) => shortRegion && (x.it.addr1 || "").includes(shortRegion));
  }
  // 그래도 없으면 전국 목록을 보여주지 않고 "없음"으로 처리 (엉뚱한 지역 축제가 나오지 않도록)

  return picked.slice(0, 5).map(({ it, dist }) => ({
    id: it.contentid,
    title: it.title,
    period: it.eventstartdate && it.eventenddate ? `${it.eventstartdate} ~ ${it.eventenddate}` : "일정 미정",
    location: it.addr1 || "위치 정보 없음",
    distanceKm: Number.isFinite(dist) ? dist.toFixed(1) : null,
  }));
}

// 2. 룰렛 휠 (SVG)
// ==========================================
function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function sliceDPath(cx, cy, r, startDeg, endDeg) {
  const start = polarToCartesian(cx, cy, r, endDeg);
  const end = polarToCartesian(cx, cy, r, startDeg);
  const largeArc = endDeg - startDeg <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}

const BLUE_PALETTE = ["#AFC9EA", "#C7DAF2", "#98BBE2"];
const RED_PALETTE = ["#F0B3AE", "#F5C9C5", "#EAA19B"];

function RouletteWheel({ spots, wheelRef }) {
  const cx = 150, cy = 150, r = 140;
  const n = spots.length;
  const vertical = true; // 감성/활기 여행 룰렛 모두 지역명을 세로로 표기
  const labelColor = "#2B2620"; // 팔레트가 연해져서 밝은 글씨 대신 진한 잉크색 사용
  if (n === 0) return null;
  const sweep = 360 / n;
  const lineHeight = 12;
  // 슬라이스마다 색을 감성(파랑)/활기(빨강)의 각자 팔레트에서 순환시켜, 두 테마가 사이사이에 섞여 보이도록 함
  let blueCounter = 0, redCounter = 0;

  return (
    <div ref={wheelRef} style={{ transform: "rotate(0deg)", willChange: "transform" }} className="w-full h-full">
      <svg viewBox="0 0 300 300" className="w-full h-full">
        {spots.map((s, i) => {
          const start = i * sweep;
          const end = start + sweep;
          const mid = start + sweep / 2;
          const labelPos = polarToCartesian(cx, cy, r * (vertical ? 0.62 : 0.66), mid);
          const chars = vertical ? Array.from(s.name.replace(/\s/g, "")) : null;
          const startY = vertical ? labelPos.y - ((chars.length - 1) * lineHeight) / 2 : 0;
          const palette = s.mood === "emotional" ? BLUE_PALETTE : RED_PALETTE;
          const fillColor = s.mood === "emotional" ? palette[blueCounter++ % palette.length] : palette[redCounter++ % palette.length];
          return (
            <g key={s.id}>
              <path d={sliceDPath(cx, cy, r, start, end)} fill={fillColor} stroke="#F6F1E7" strokeWidth="1.5" />
              {vertical ? (
                // 세로로 쌓은 글자 블록을 섹터의 중심 각도(mid)만큼 회전시켜, 부채꼴 모양(방사형)에 맞춰 눕힌다
                <text
                  x={labelPos.x} fill={labelColor} fontSize="11" fontWeight="700"
                  textAnchor="middle"
                  transform={`rotate(${mid}, ${labelPos.x}, ${labelPos.y})`}
                >
                  {chars.map((c, ci) => (
                    <tspan key={ci} x={labelPos.x} y={startY + ci * lineHeight}>{c}</tspan>
                  ))}
                </text>
              ) : (
                <text
                  x={labelPos.x} y={labelPos.y}
                  fill={labelColor} fontSize="11" fontWeight="700"
                  textAnchor="middle"
                  transform={`rotate(${mid}, ${labelPos.x}, ${labelPos.y})`}
                >
                  {s.name}
                </text>
              )}
            </g>
          );
        })}
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#B8860B" strokeWidth="2" />
      </svg>
    </div>
  );
}

const TAB_CONFIG = {
  landmark: { label: "명소", icon: Compass, kind: "tour", contentTypeId: 12 },
  restaurant: { label: "맛집", icon: Utensils, kind: "tour", contentTypeId: 39 },

  cafe: { label: "카페", icon: Coffee, kind: "map" },

};

function ResultDetailTabs({ spot, cache, setCache }) {
  const [tab, setTab] = useState("landmark");
  const cfg = TAB_CONFIG[tab];
  const needsFetch = cfg.kind === "tour" || cfg.kind === "festival";
  const cacheKey = `${spot.id}:${tab}`;
  const entry = needsFetch ? cache[cacheKey] : null;

  useEffect(() => {
    if (!needsFetch) return;
    if (cache[cacheKey]) return;
    let cancelled = false;
    setCache((prev) => ({ ...prev, [cacheKey]: { status: "loading" } }));

    async function run() {
      try {
        let data = [];
        if (cfg.kind === "festival") {
          data = await fetchLocalFestivals({ regionKeyword: spot.name, lat: spot.lat, lng: spot.lng });
        } else if (cfg.kind === "tour") {
          data = await fetchNearbyTourSpots({ lat: spot.lat, lng: spot.lng, contentTypeId: cfg.contentTypeId, num: 5 });
        }
        if (cancelled) return;
        setCache((prev) => ({ ...prev, [cacheKey]: { status: data.length > 0 ? "success" : "empty", data } }));
      } catch (err) {
        if (cancelled) return;
        const message = `${err.message}${err.code === "HTTP_ERROR" ? " 네트워크 문제일 수 있어요." : ""}`;
        setCache((prev) => ({ ...prev, [cacheKey]: { status: "error", message } }));
      }
    }
    run();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tab, spot.id]);

  return (
    <div className="mt-4">
      <div className="flex gap-1 bg-white/40 rounded-lg p-1 overflow-x-auto">
        {Object.entries(TAB_CONFIG).map(([key, t]) => {
          const Icon = t.icon;
          const active = tab === key;
          return (
            <button
              key={key}
              onClick={() => setTab(key)}
              className="flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-md text-[10px] font-medium min-w-[44px]"
              style={{ background: active ? "#2B2620" : "transparent", color: active ? "#F6F1E7" : "#6B5F4F" }}
            >
              <Icon size={13} />
              {t.label}
            </button>
          );
        })}
      </div>

      <div className="mt-3">
        {cfg.kind === "map" ? (
          <MapLinkList links={buildMapSearchLinks(spot, tab === "bookstore" ? "서점" : "카페")} />
        ) : !entry || entry.status === "loading" ? (
          <StatusBlock status="loading" />
        ) : entry.status === "error" ? (
          <StatusBlock status="error" error={entry.message} />
        ) : entry.status === "empty" ? (
          <StatusBlock status="empty" emptyText="검색된 정보가 없어요." />
        ) : cfg.kind === "festival" ? (
          <FestivalList items={entry.data} />
        ) : (
          <RestaurantList items={entry.data} />
        )}
      </div>
    </div>
  );
}

// 7. 메인 화면
// ==========================================
// API 키처럼 새로고침해도 유지됐으면 하는 값을 localStorage와 동기화하는 훅.
// localStorage를 쓸 수 없는 환경(일부 미리보기 iframe, 프라이빗 모드 등)에서는
// 조용히 실패하고 평범한 메모리 state로만 동작한다 (에러로 앱이 죽지 않음).
function usePersistentState(key, initialValue) {
  const [value, setValue] = useState(() => {
    try {
      const saved = window.localStorage.getItem(key);
      return saved !== null ? saved : initialValue;
    } catch {
      return initialValue;
    }
  });

  useEffect(() => {
    try {
      window.localStorage.setItem(key, value);
    } catch {
      // 저장 불가 환경 - 무시하고 메모리 state만 유지
    }
  }, [key, value]);

  return [value, setValue];
}

function BaramApp() {
  const [spots, setSpots] = useState(() => buildSpots());
  const [region, setRegion] = useState("전체");
  const [currentLocation, setCurrentLocation] = useState(() => LOCATIONS.find((l) => l.name === "하남시"));
  const [rouletteSpots, setRouletteSpots] = useState([]);
  const [result, setResult] = useState(null);
  const [phase, setPhase] = useState("idle"); // idle | ramping | spinning | stopping
  const [locationDialogOpen, setLocationDialogOpen] = useState(false);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [detailCache, setDetailCache] = useState({});
  const [stampSpotId, setStampSpotId] = useState(null);
  const [birthInfoRaw, setBirthInfoRaw] = usePersistentState("baram_birthInfo", "");
  const [birthModalOpen, setBirthModalOpen] = useState(false);

  const birthInfo = useMemo(() => {
    try {
      return birthInfoRaw ? JSON.parse(birthInfoRaw) : null;
    } catch {
      return null;
    }
  }, [birthInfoRaw]);
  const saju = useMemo(() => (birthInfo ? computeSaju(birthInfo) : null), [birthInfo]);
  const travelFortune = useMemo(() => (saju ? getTravelFortune(saju) : null), [saju]);

  function saveBirthInfo(info) {
    setBirthInfoRaw(JSON.stringify(info));
    setBirthModalOpen(false);
  }

  const wheelRef = useRef(null);
  const angleRef = useRef(0);
  const rafRef = useRef(null);
  const rampTimeoutRef = useRef(null);

  const visitedCount = spots.filter((s) => s.isVisited).length;
  // 감성/활기를 더 이상 따로 고르지 않으므로, 뽑힌 결과의 테마에 맞춰 강조색이 바뀐다
  const accent = result ? (result.mood === "emotional" ? "#1B4B91" : "#B3261E") : "#2B2620";

  // 감성 여행 + 활기찬 여행을 하나로 합쳐, 두 테마가 최대한 번갈아 나오도록 15곳을 뽑는다
  function pick15(currentSpots, currentRegion, currentLoc) {
    const candidates = currentSpots.filter((s) => {
      if (s.isVisited) return false;
      if (s.name === currentLoc.name) return false;
      if (currentRegion !== "전체" && s.region !== currentRegion) return false;
      return true;
    });
    const emotional = shuffle(candidates.filter((s) => s.mood === "emotional"));
    const energetic = shuffle(candidates.filter((s) => s.mood === "energetic"));

    // 감성/활기 두 목록을 하나씩 번갈아 채워서 사이사이에 섞이도록 구성
    const interleaved = [];
    let ei = 0, gi = 0;
    let turnEmotional = true;
    while (interleaved.length < 15 && (ei < emotional.length || gi < energetic.length)) {
      if (turnEmotional && ei < emotional.length) {
        interleaved.push(emotional[ei++]);
      } else if (!turnEmotional && gi < energetic.length) {
        interleaved.push(energetic[gi++]);
      } else if (ei < emotional.length) {
        interleaved.push(emotional[ei++]);
      } else if (gi < energetic.length) {
        interleaved.push(energetic[gi++]);
      }
      turnEmotional = !turnEmotional;
    }

    setRouletteSpots(interleaved);
    setResult(null);
    angleRef.current = 0;
    if (wheelRef.current) wheelRef.current.style.transform = "rotate(0deg)";
  }

  // 앱이 처음 열릴 때 IndexedDB에 저장된 도장깨기 진행 기록을 불러와 병합한 뒤 룰렛을 뽑는다.
  // (IndexedDB는 비동기라 useState 초기값으로는 못 쓰고, 마운트 후 이렇게 불러와야 한다)
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const progress = await loadSpotsProgress();
      if (cancelled) return;
      const merged = mergeSpotsWithProgress(spots, progress);
      setSpots(merged);
      pick15(merged, region, currentLocation);
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function changeRegion(next) {
    if (phase !== "idle") return;
    setRegion(next);
    pick15(spots, next, currentLocation);
  }

  function selectLocation(loc) {
    setCurrentLocation(loc);
    setLocationDialogOpen(false);
    pick15(spots, region, loc);
  }

  function conquerSpot(id) {
    setSpots((prev) => {
      const next = prev.map((s) => (s.id === id ? { ...s, isVisited: true, visitedDate: new Date().toISOString() } : s));
      const updated = next.find((s) => s.id === id);
      if (updated) saveSpotProgress(updated);
      pick15(next, region, currentLocation);
      return next;
    });
  }

  function unvisitSpot(id) {
    setSpots((prev) => {
      const next = prev.map((s) => (s.id === id ? { ...s, isVisited: false, visitedDate: null } : s));
      const updated = next.find((s) => s.id === id);
      if (updated) saveSpotProgress(updated);
      pick15(next, region, currentLocation);
      return next;
    });
  }

  // 도장깨기: 여행지에 남기는 추억(사진 2컷 + 메모)
  function updateSpotMemo(id, text) {
    setSpots((prev) => {
      const next = prev.map((s) => (s.id === id ? { ...s, memo: text } : s));
      const updated = next.find((s) => s.id === id);
      if (updated) saveSpotProgress(updated);
      return next;
    });
  }

  // 원본 사진을 그대로 base64로 저장하면 장당 수 MB씩 쌓여 브라우저 메모리를 많이 차지한다.
  // 캔버스에 그려서 가로 최대 900px, JPEG 품질 0.75로 줄인 뒤 저장한다 (보통 장당 100~200KB 수준).
  function compressImage(file, maxWidth = 900, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        reject(new Error("이미지를 불러올 수 없어요."));
      };
      img.src = objectUrl;
    });
  }

  function updateSpotPhoto(id, slotIndex, file) {
    compressImage(file)
      .then((dataUrl) => {
        setSpots((prev) => {
          const next = prev.map((s) => {
            if (s.id !== id) return s;
            const photos = s.photos && s.photos.length === 2 ? [...s.photos] : [null, null];
            photos[slotIndex] = dataUrl;
            return { ...s, photos };
          });
          const updated = next.find((s) => s.id === id);
          if (updated) saveSpotProgress(updated);
          return next;
        });
      })
      .catch(() => {
        // 압축 실패(지원 안 되는 파일 등) 시 조용히 무시 - 사진 슬롯은 비어있는 채로 유지
      });
  }

  function removeSpotPhoto(id, slotIndex) {
    setSpots((prev) => {
      const next = prev.map((s) => {
        if (s.id !== id) return s;
        const photos = s.photos && s.photos.length === 2 ? [...s.photos] : [null, null];
        photos[slotIndex] = null;
        return { ...s, photos };
      });
      const updated = next.find((s) => s.id === id);
      if (updated) saveSpotProgress(updated);
      return next;
    });
  }

  function startSpin() {
    if (rouletteSpots.length === 0 || phase !== "idle") return;
    setResult(null);
    setPhase("ramping");
    const el = wheelRef.current;
    const rampTarget = angleRef.current + 720;
    el.style.transition = "transform 0.6s cubic-bezier(0.55,0,1,0.45)";
    el.style.transform = `rotate(${rampTarget}deg)`;
    angleRef.current = rampTarget;
    rampTimeoutRef.current = setTimeout(() => {
      el.style.transition = "none";
      setPhase("spinning");
      let last = performance.now();
      function loop(now) {
        const dt = now - last;
        last = now;
        angleRef.current += dt * 0.55;
        el.style.transform = `rotate(${angleRef.current}deg)`;
        rafRef.current = requestAnimationFrame(loop);
      }
      rafRef.current = requestAnimationFrame(loop);
    }, 620);
  }

  function stopSpin() {
    if (phase === "idle" || phase === "stopping" || rouletteSpots.length === 0) return;
    cancelAnimationFrame(rafRef.current);
    clearTimeout(rampTimeoutRef.current);
    setPhase("stopping");

    const n = rouletteSpots.length;
    const selectedIndex = Math.floor(Math.random() * n);
    const sectionAngle = 360 / n;
    const targetSectorAngle = 360 - selectedIndex * sectionAngle - sectionAngle / 2;
    const current = angleRef.current % 360;
    const finalAngle = angleRef.current + (1080 + targetSectorAngle - current);

    const el = wheelRef.current;
    el.style.transition = "transform 3s cubic-bezier(0.16,1,0.3,1)";
    el.style.transform = `rotate(${finalAngle}deg)`;
    angleRef.current = finalAngle;

    setTimeout(() => {
      setPhase("idle");
      setResult(rouletteSpots[selectedIndex]);
    }, 3050);
  }

  function handleWheelTap() {
    if (phase === "idle") startSpin();
    else if (phase !== "stopping") stopSpin();
  }

  useEffect(() => () => {
    cancelAnimationFrame(rafRef.current);
    clearTimeout(rampTimeoutRef.current);
  }, []);

  // 룰렛 결과(지역)가 정해지면 그 지역의 명소·맛집을 공공데이터(TourAPI, 서버 프록시)로 불러와 하루 일정표를 구성한다
  const itineraryKey = result ? `${result.id}:itinerary` : null;
  useEffect(() => {
    if (!result || !itineraryKey) return;
    if (detailCache[itineraryKey]) return;
    let cancelled = false;
    setDetailCache((prev) => ({ ...prev, [itineraryKey]: { status: "loading" } }));

    (async () => {
      try {
        const [landmarks, restaurants] = await Promise.all([
          fetchNearbyTourSpots({ lat: result.lat, lng: result.lng, contentTypeId: 12, num: 3 }),
          fetchNearbyTourSpots({ lat: result.lat, lng: result.lng, contentTypeId: 39, num: 3 }),
        ]);
        if (cancelled) return;
        setDetailCache((prev) => ({ ...prev, [itineraryKey]: { status: "success", data: { landmarks, restaurants } } }));
      } catch (err) {
        if (cancelled) return;
        setDetailCache((prev) => ({ ...prev, [itineraryKey]: { status: "error", message: err.message, code: err.code } }));
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [result]);
  const itineraryEntry = itineraryKey ? detailCache[itineraryKey] : null;
  // 결과가 바뀔 때만 새로 뽑히도록 useMemo로 고정 (탭 전환 등 다른 리렌더에는 곡이 안 바뀜)
  const gayoSongs = useMemo(() => pickRandomN(GAYO_SONGS, 1), [result?.id]);
  const popSongs = useMemo(() => pickRandomN(POP_SONGS, 1), [result?.id]);

  const route = result ? distanceEta(currentLocation.lat, currentLocation.lng, result.lat, result.lng) : null;
  const disabled = phase !== "idle";

  return (
    <div className="min-h-screen bg-[#F6F1E7] flex justify-center py-8 px-4">
      <div className="w-full max-w-sm">
        {/* Header */}
        <div className="flex items-center justify-between mb-6">
          <div>
            <p className="text-xs tracking-wide font-bold text-[#1B4B91]">여행 룰렛</p>
            <h1 className="font-serif text-2xl font-bold text-[#DC2626]">BARAM</h1>
          </div>
          <div className="flex items-center gap-2">
            <button
              onClick={() => setDrawerOpen(true)}
              className="relative w-10 h-10 rounded-full border border-[#D9CBB0] flex items-center justify-center text-[#2B2620]"
              aria-label="도장깨기 열기"
            >
              <Package size={18} />
              {visitedCount > 0 && (
                <span className="absolute -top-1.5 -right-1.5 bg-[#C4592F] text-[#F6F1E7] text-[10px] font-medium rounded-full px-1.5 py-0.5 min-w-[18px] text-center">
                  {visitedCount}
                </span>
              )}
            </button>
          </div>
        </div>

        {/* 내 위치 */}
        <button
          onClick={() => setLocationDialogOpen(true)}
          className="w-full flex items-center gap-2 bg-white/50 border border-[#D9CBB0] rounded-xl px-4 py-3 text-left"
        >
          <MapPin size={16} style={{ color: accent }} />
          <span className="flex-1 text-sm font-medium text-[#2B2620]">내 위치: {currentLocation.name}</span>
          <Search size={14} className="text-[#A6987F]" />
        </button>

        {/* 오늘의 여행운 (재미 코너) */}
        {travelFortune ? (
          <TravelFortuneCard fortune={travelFortune} onEdit={() => setBirthModalOpen(true)} />
        ) : (
          <button
            onClick={() => setBirthModalOpen(true)}
            className="w-full mt-4 flex items-center justify-center gap-1.5 border border-dashed border-[#D9CBB0] rounded-xl px-4 py-2.5 text-xs text-[#6B5F4F]"
          >
            ✦ 생년월일을 입력하고 나만의 여행운 보기
          </button>
        )}

        {/* 감성+활기 통합 배너 (더 이상 따로 고르지 않음) */}
        <div
          className="mt-4 rounded-xl px-4 py-3 text-center"
          style={{ background: "linear-gradient(90deg, #DCE7F5 0%, #F3E9DC 50%, #F8DCDC 100%)", border: "1px solid #D9CBB0" }}
        >
          <p className="text-sm font-extrabold" style={{ background: "linear-gradient(90deg, #1B4B91, #B3261E)", WebkitBackgroundClip: "text", backgroundClip: "text", color: "transparent" }}>
            몰라!! 돌려서 나오는 데로 갈꺼야! ({spots.length}개 지역)
          </p>
          <p className="text-[11px] text-[#6B5F4F] mt-1 flex items-center justify-center gap-1">
            <Moon size={11} /> 감성 여행 + <Zap size={11} /> 활기찬 여행이 룰렛 안에서 번갈아 섞여요
          </p>
        </div>

        {/* 지역 필터 (1줄: 전체·서울·경기·인천 / 2줄: 강원·충청·영남·호남) - 지역마다 고유 색상 */}
        <div className="mt-4 space-y-2">
          <div className="flex gap-2 justify-center">
            {REGION_LIST.slice(0, 4).map((r) => {
              const c = REGION_COLORS[r];
              const active = region === r;
              return (
                <button
                  key={r}
                  disabled={disabled}
                  onClick={() => changeRegion(r)}
                  className="flex-1 text-xs px-2 py-1.5 rounded-full border font-bold disabled:opacity-60"
                  style={{
                    borderColor: c,
                    background: active ? c : `${c}1F`,
                    color: active ? "#F6F1E7" : c,
                  }}
                >
                  {r}
                </button>
              );
            })}
          </div>
          <div className="flex gap-2 justify-center">
            {REGION_LIST.slice(4).map((r) => {
              const c = REGION_COLORS[r];
              const active = region === r;
              return (
                <button
                  key={r}
                  disabled={disabled}
                  onClick={() => changeRegion(r)}
                  className="flex-1 text-xs px-2 py-1.5 rounded-full border font-bold disabled:opacity-60"
                  style={{
                    borderColor: c,
                    background: active ? c : `${c}1F`,
                    color: active ? "#F6F1E7" : c,
                  }}
                >
                  {r}
                </button>
              );
            })}
          </div>
        </div>

        {/* 룰렛 */}
        <div className="relative mx-auto mt-8" style={{ width: 280, height: 280 }}>
          {rouletteSpots.length > 0 ? (
            <RouletteWheel spots={rouletteSpots} wheelRef={wheelRef} />
          ) : (
            <div className="w-full h-full flex items-center justify-center text-center text-sm text-[#6B5F4F] whitespace-pre-line">
              {"해당 조건의 미정복 도시를\n모두 탐험하셨습니다!"}
            </div>
          )}

          {/* 포인터: 지도 핀(물방울) 모양 */}
          <svg width="26" height="34" viewBox="0 0 26 34" className="absolute -top-3 left-1/2 -translate-x-1/2 drop-shadow-md">
            <path d="M3 13 L13 32 L23 13 Z" fill="#B8860B" stroke="#2B2620" strokeWidth="1.2" strokeLinejoin="round" />
            <circle cx="13" cy="12" r="10" fill="#B8860B" stroke="#2B2620" strokeWidth="1.2" />
            <circle cx="13" cy="12" r="4" fill="#F6F1E7" />
          </svg>

          <button
            onClick={handleWheelTap}
            disabled={rouletteSpots.length === 0}
            className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full border-4 border-[#F6F1E7] flex items-center justify-center text-sm font-bold text-white disabled:opacity-50"
            style={{ background: phase === "spinning" || phase === "ramping" ? "#A8441F" : accent }}
          >
            {phase === "stopping" ? "추첨중" : phase === "idle" ? "START" : "STOP"}
          </button>
        </div>
        <p className="text-center text-[11px] text-[#A6987F] mt-2">
          내 위치({currentLocation.name}) 제외 · 후보 {rouletteSpots.length}곳
        </p>

        {/* 결과 카드 */}
        {result && route && (
          <div className="mt-6 bg-white/60 border border-dashed border-[#B8860B] rounded-xl p-5">
            <div className="flex items-center justify-between">
              <span className="text-[10px] tracking-wide px-2 py-0.5 rounded-full" style={{ background: result.mood === "emotional" ? "#DCE7F5" : "#F8DCDC", color: accent }}>
                {result.region}
              </span>
              <span className="text-[10px] text-[#A6987F] flex items-center gap-1">
                {result.mood === "emotional" ? <Moon size={11} /> : <Zap size={11} />}
                {result.mood === "emotional" ? "감성 코스" : "활기 코스"}
              </span>
            </div>
            <h3 className="font-serif text-xl text-[#2B2620] mt-2">{result.name}</h3>
            <p className="text-sm text-[#6B5F4F] mt-1">{result.description}</p>

            <div className="border-t border-[#D9CBB0] my-3" />
            <div className="flex items-center gap-1.5 text-sm font-medium text-[#2B2620]">
              <Car size={14} /> 예상 소요: {route.duration} ({route.distance})
            </div>

            <DayItinerary spot={result} entry={itineraryEntry} gayoSongs={gayoSongs} popSongs={popSongs} />

            <div className="border-t border-[#D9CBB0] my-4" />
            <p className="text-xs font-medium text-[#2B2620] mb-1">더 알아보기</p>
            <ResultDetailTabs
              spot={result}
              cache={detailCache}
              setCache={setDetailCache}
            />

            <button
              onClick={() => {
                conquerSpot(result.id);
                setDrawerOpen(true);
              }}
              className="w-full mt-4 py-2.5 rounded-lg text-sm font-medium text-[#F6F1E7]"
              style={{ background: accent }}
            >
              도시 정복 완료
            </button>
          </div>
        )}
      </div>

      {locationDialogOpen && (
        <LocationDialog
          currentLocation={currentLocation}
          onSelect={selectLocation}
          onClose={() => setLocationDialogOpen(false)}
        />
      )}
      {drawerOpen && (
        <DrawerModal
          spots={spots}
          onUnvisit={unvisitSpot}
          onOpenStamp={(id) => setStampSpotId(id)}
          onClose={() => setDrawerOpen(false)}
        />
      )}
      {stampSpotId && spots.find((s) => s.id === stampSpotId) && (
        <StampDetailModal
          spot={spots.find((s) => s.id === stampSpotId)}
          onChangeMemo={(text) => updateSpotMemo(stampSpotId, text)}
          onChangePhoto={(slotIndex, file) => updateSpotPhoto(stampSpotId, slotIndex, file)}
          onRemovePhoto={(slotIndex) => removeSpotPhoto(stampSpotId, slotIndex)}
          onClose={() => setStampSpotId(null)}
        />
      )}
      {birthModalOpen && (
        <BirthInfoModal
          initial={birthInfo}
          onSave={saveBirthInfo}
          onClose={() => setBirthModalOpen(false)}
        />
      )}
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<BaramApp />);
</script>
</body>
</html>

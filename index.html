const LOCATIONS = RAW_LOCATIONS.map(([name, region, lat, lng]) => ({ name, region, lat, lng }));
const REGION_LIST = ["전체", "서울", "경기", "인천·제주", "강원", "충청", "영남", "호남"];
// 지역 배너(필터 칩)마다 구분되는 고유 색상
const REGION_COLORS = {
  "전체": "#2B2620",
  "서울": "#2B4C7E", // 도심 - 네이비
  "경기": "#3D7A5C", // 평야/신도시 - 그린
  "인천·제주": "#1D8A99", // 항구·섬 - 청록
  "강원": "#2F6E45", // 산악 - 짙은 그린
  "충청": "#C08A2E", // 고도/역사 - 골드브라운
  "영남": "#C15B2A", // 해안/산업 - 테라코타
  "호남": "#3D8361", // 곡창지대 - 청록빛 그린
};

// 229곳을 감성/활기로 반씩 나눈다. 권역마다 지역 순서를 섞은 뒤 번갈아 배정해서
// 특정 권역이 한쪽 테마에 몰리지 않게 한다.
// 고정된 시드로 섞기 때문에 앱을 다시 켜도, 다른 사람 폰에서도 지역마다 테마가 항상 같다.
// (MOOD_SEED를 바꾸면 모든 지역의 테마가 새로 정해지니 바꾸지 말 것)
const MOOD_SEED = 20260926;
function buildSpots() {
  const moodByLocIndex = new Array(LOCATIONS.length);
  let startEmotional = true;
  REGION_LIST.filter((r) => r !== "전체").forEach((region) => {
    const idxs = LOCATIONS.map((l, i) => (l.region === region ? i : -1)).filter((i) => i >= 0);
    seededShuffle(idxs, MOOD_SEED).forEach((locIdx, order) => {
      moodByLocIndex[locIdx] = (order % 2 === 0) === startEmotional ? "emotional" : "energetic";
    });
    // 지역 수가 홀수인 권역이 있어도 전체 감성/활기 수가 한쪽으로 쏠리지 않도록 시작 테마를 번갈아 바꾼다
    if (idxs.length % 2 === 1) startEmotional = !startEmotional;
  });

  return LOCATIONS.map((loc, i) => {
    const mood = moodByLocIndex[i];
    return {
      id: `spot_${i}`,
      name: loc.name,
      region: loc.region,
      lat: loc.lat,
      lng: loc.lng,
      mood,
      description:
        mood === "emotional"
          ? `고요한 ${loc.name}의 골목과 풍경을 여유롭게 걸어보는 감성 코스예요.`
          : `${loc.name}에서 액티비티와 로컬 명소를 부지런히 둘러보는 활기찬 코스예요.`,
      isVisited: false,
      visitedDate: null,
      photos: [null, null],
      memo: "",
    };
  });
}

// ==========================================
// 1-1. 도장깨기 진행 상황(정복 여부/사진/메모) IndexedDB 저장
// localStorage(보통 5~10MB 한도)보다 훨씬 넉넉한 저장공간(브라우저별로 다르지만
// 보통 수백 MB~수 GB)을 쓰기 위해 IndexedDB로 저장한다. 도시 한 곳당 레코드 하나씩
// 저장해서, 사진 한 장이 바뀔 때마다 229곳 전체를 다시 쓰지 않고 그 도시 레코드만 갱신한다.
// ==========================================
const IDB_NAME = "baram-db";
const IDB_VERSION = 1;
const IDB_STORE = "spots_progress";
const LEGACY_LOCALSTORAGE_KEY = "baram_spots_progress"; // 이전 버전(localStorage)에서 쓰던 키

// 앱을 껐다 켜도 "지금 이동 중인 여행지"가 사라지지 않도록 마지막 룰렛 결과/현재 위치를
// localStorage에 저장해둔다 (새로 룰렛을 돌리기 전까지 유지).
const CURRENT_RESULT_KEY = "baram_current_result_id";
const CURRENT_LOCATION_KEY = "baram_current_location_name";

function openSpotsDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error("이 브라우저는 IndexedDB를 지원하지 않아요."));
      return;
    }
    const req = window.indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("IndexedDB를 열 수 없어요."));
  });
}

// 이전 버전에서 localStorage에 저장해둔 진행 기록이 있으면 IndexedDB로 한 번만 옮긴다.
async function migrateLegacyLocalStorageProgress(db) {
  try {
    const raw = window.localStorage.getItem(LEGACY_LOCALSTORAGE_KEY);
    if (!raw) return;
    const oldProgress = JSON.parse(raw);
    const ids = Object.keys(oldProgress || {});
    if (ids.length === 0) {
      window.localStorage.removeItem(LEGACY_LOCALSTORAGE_KEY);
      return;
    }
    await new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      const store = tx.objectStore(IDB_STORE);
      ids.forEach((id) => store.put({ id, ...oldProgress[id] }));
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
    window.localStorage.removeItem(LEGACY_LOCALSTORAGE_KEY);
  } catch {
    // 이관 실패해도 무시 (다음 실행 때 다시 시도되지 않도록 조용히 넘어감)
  }
}

async function loadSpotsProgress() {
  try {
    const db = await openSpotsDB();
    await migrateLegacyLocalStorageProgress(db);
    return await new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = () => {
        const map = {};
        (req.result || []).forEach((rec) => { map[rec.id] = rec; });
        resolve(map);
      };
      req.onerror = () => resolve({});
    });
  } catch {
    return {};
  }
}

// 백업 불러오기: 저장된 진행 기록을 전부 지우고 백업 내용으로 바꾼다
async function replaceAllSpotsProgress(records) {
  const db = await openSpotsDB();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    const store = tx.objectStore(IDB_STORE);
    store.clear();
    records.forEach((rec) => store.put(rec));
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error || new Error("백업을 저장하지 못했어요."));
  });
}

// ==========================================
// 1-1b. 도장깨기 백업 파일 (내보내기/불러오기)
// 기록은 폰 안에만 있어서 앱을 지우거나 폰을 바꾸면 사라진다. 그래서 파일로 빼 둘 수 있게 한다.
// spot id는 지역 목록 순서로 만들어지므로, 나중에 목록이 바뀌어도 맞게 찾아가도록 지역 이름도 같이 저장한다.
// ==========================================
const BACKUP_APP_NAME = "BARAM";
const BACKUP_VERSION = 1;
const LAST_BACKUP_KEY = "baram_last_backup_at";

function hasProgress(s) {
  return s.isVisited || (s.memo && s.memo.trim().length > 0) || (s.photos && s.photos.some(Boolean));
}

function buildBackup(spots) {
  return {
    app: BACKUP_APP_NAME,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    spots: spots.filter(hasProgress).map((s) => ({
      id: s.id,
      name: s.name,
      isVisited: s.isVisited,
      visitedDate: s.visitedDate,
      photos: s.photos,
      memo: s.memo,
    })),
  };
}

// 백업 파일 내용을 지금 지역 목록에 맞는 진행 기록 목록으로 바꾼다 (형식이 틀리면 오류)
function parseBackup(text, baseSpots) {
  let data;
  try {
    data = JSON.parse(text);
  } catch {
    throw new Error("BARAM 백업 파일이 아니에요.");
  }
  if (!data || data.app !== BACKUP_APP_NAME || !Array.isArray(data.spots)) {
    throw new Error("BARAM 백업 파일이 아니에요.");
  }
  const records = [];
  data.spots.forEach((b) => {
    const spot = baseSpots.find((s) => s.name === b.name) || baseSpots.find((s) => s.id === b.id);
    if (!spot) return;
    records.push({
      id: spot.id,
      isVisited: !!b.isVisited,
      visitedDate: b.visitedDate || null,
      photos: Array.isArray(b.photos) && b.photos.length === 2 ? b.photos : [null, null],
      memo: typeof b.memo === "string" ? b.memo : "",
    });
  });
  return { records, exportedAt: data.exportedAt };
}

function downloadJson(filename, obj) {
  const blob = new Blob([JSON.stringify(obj)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function mergeSpotsWithProgress(baseSpots, progress) {
  if (!progress || Object.keys(progress).length === 0) return baseSpots;
  return baseSpots.map((s) => {
    const p = progress[s.id];
    if (!p) return s;
    return {
      ...s,
      isVisited: !!p.isVisited,
      visitedDate: p.visitedDate || null,
      photos: p.photos && p.photos.length === 2 ? p.photos : [null, null],
      memo: p.memo || "",
    };
  });
}

// 도시 한 곳의 진행 기록만 IndexedDB에 기록한다 (fire-and-forget: 실패해도 화면의
// React state는 그대로 유지되니 앱 동작에는 지장이 없다).
async function saveSpotProgress(spot) {
  try {
    const db = await openSpotsDB();
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put({
      id: spot.id,
      isVisited: spot.isVisited,
      visitedDate: spot.visitedDate,
      photos: spot.photos,
      memo: spot.memo,
    });
  } catch {
    // 저장 실패해도 앱은 계속 동작한다.
  }
}

// 육지와 다리로 이어지지 않은 섬 지역. 같은 섬 안(제주시↔서귀포시)은 차로 갈 수 있다.
const ISLAND_GROUP = { "제주시": "제주", "서귀포시": "제주", "울릉군": "울릉", "옹진군": "옹진" };

// 출발지와 목적지가 섬/육지로 갈리면 차로 갈 수 없으므로 자동차 소요시간 대신 배·비행기 안내를 한다
function needsFerryOrFlight(fromName, toName) {
  const a = ISLAND_GROUP[fromName] || null;
  const b = ISLAND_GROUP[toName] || null;
  return (a || b) && a !== b;
}

function distanceEta(lat1, lng1, lat2, lng2) {
  const p = 0.017453292519943295;
  const a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 +
    Math.cos(lat1 * p) * Math.cos(lat2 * p) * (1 - Math.cos((lng2 - lng1) * p)) / 2;
  const straightKm = 12742 * Math.asin(Math.sqrt(a));
  const roadKm = straightKm * 1.32;
  const totalMinutes = Math.round((roadKm / 80) * 60);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  return { distance: `${roadKm.toFixed(1)}km`, duration: h > 0 ? `${h}시간 ${m}분` : `${m}분` };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 같은 시드면 항상 같은 순서로 섞는다 (mulberry32 난수 생성기 사용)
function seededShuffle(arr, seed) {
  let t = seed >>> 0;
  const random = () => {
    t = (t + 0x6d2b79f5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  return `${dt.getFullYear()}.${String(dt.getMonth() + 1).padStart(2, "0")}.${String(dt.getDate()).padStart(2, "0")}`;
}

// 날짜 입력칸(<input type="date">)은 "YYYY-MM-DD" 문자열을 쓰므로 저장값(ISO)과 서로 바꿔준다
function toDateInputValue(d) {
  const dt = d ? new Date(d) : new Date();
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}

// 시간대 때문에 날짜가 하루 밀리지 않도록 그날 정오(현지 시각)로 저장한다
function fromDateInputValue(value) {
  const [y, m, d] = value.split("-").map(Number);
  return new Date(y, m - 1, d, 12).toISOString();
}

// ==========================================
// 1-1a. 사주(四柱) 계산 엔진
// 명식(년/월/일/시주, 오행) 계산은 실제 만세력 공식을 따른다. 절기 경계일은 매해 ±1일
// 정도 움직이는데, 여기서는 대표적인 고정 날짜로 근사한다(대부분의 해에 정확히 맞음).
// 음력 생년월일은 지원하지 않는다(변환표 없이는 정확도를 보장할 수 없어서 양력만 받는다).
// 일주(日柱) 기준일: 2024-01-01 = 병인일(인덱스 2) — 1900-01-01(병자)·2000-01-01(경신)·
// 2000-02-04(갑오)·2000-02-29(기미)·2000-12-31(을축)·2010-01-01(계축)·2020-01-01(을사)·
// 2020-02-29(갑진)·2024-01-04(기사) 총 10개 지점과 대조해 전부 일치함을 검증함.
// ==========================================
const STEMS = ["갑", "을", "병", "정", "무", "기", "경", "신", "임", "계"];
const BRANCHES = ["자", "축", "인", "묘", "진", "사", "오", "미", "신", "유", "술", "해"];
const STEM_ELEMENT = ["목", "목", "화", "화", "토", "토", "금", "금", "수", "수"];
const BRANCH_ELEMENT = ["수", "토", "목", "목", "토", "화", "화", "토", "금", "금", "토", "수"];
const ELEMENTS = ["목", "화", "토", "금", "수"];

function mod(n, m) {
  return ((n % m) + m) % m;
}

function ganjiLabel(stemIdx, branchIdx) {
  return `${STEMS[stemIdx]}${BRANCHES[branchIdx]}`;
}

// 일주: 2024-01-01(UTC 자정 기준 날짜)을 병인(인덱스 2)로 두고 날짜 차이를 60으로 나눈 나머지
function dayGanjiIndex(y, m, d) {
  const target = Date.UTC(y, m - 1, d);
  const epoch = Date.UTC(2024, 0, 1);
  const diffDays = Math.round((target - epoch) / 86400000);
  return mod(diffDays + 2, 60);
}

// 연주: 입춘(양력 2/4 근사)을 새해 기준으로 삼는다. 2024년 = 갑진년(간지 인덱스: 갑0/진4)
function yearGanjiIndex(y, m, d) {
  let year = y;
  if (m < 2 || (m === 2 && d < 4)) year -= 1;
  const offset = year - 2024;
  return { stemIdx: mod(offset, 10), branchIdx: mod(4 + offset, 12) };
}

// 절기(월 경계) 근사 날짜 - 각 절입일부터 해당 지지(월건)가 시작됨
const MONTH_CUTOFFS = [
  { m: 2, d: 4, branch: 2 },   // 입춘 -> 인월
  { m: 3, d: 6, branch: 3 },   // 경칩 -> 묘월
  { m: 4, d: 5, branch: 4 },   // 청명 -> 진월
  { m: 5, d: 5, branch: 5 },   // 입하 -> 사월
  { m: 6, d: 6, branch: 6 },   // 망종 -> 오월
  { m: 7, d: 7, branch: 7 },   // 소서 -> 미월
  { m: 8, d: 8, branch: 8 },   // 입추 -> 신월
  { m: 9, d: 8, branch: 9 },   // 백로 -> 유월
  { m: 10, d: 8, branch: 10 }, // 한로 -> 술월
  { m: 11, d: 7, branch: 11 }, // 입동 -> 해월
  { m: 12, d: 7, branch: 0 },  // 대설 -> 자월
];

function monthBranchIndex(y, m, d) {
  const key = m * 100 + d;
  if (key < 106) return 0; // 1/1~1/5 -> 직전 해 대설 이후, 여전히 자월
  if (key < 204) return 1; // 1/6~2/3 -> 소한 이후, 축월
  let branch = 1;
  for (const c of MONTH_CUTOFFS) {
    if (key >= c.m * 100 + c.d) branch = c.branch;
  }
  return branch;
}

// 오호둔월법: 연간에 따라 인월(寅月)의 천간이 정해지고, 이후 월지 순서대로 천간이 循環한다
function monthGanjiIndex(yearStemIdx, monthBranchIdx) {
  const startStemForIn = mod(2 * mod(yearStemIdx, 5) + 2, 10); // 인월의 천간
  const steps = mod(monthBranchIdx - 2, 12); // 인(2)로부터 몇 걸음 떨어져 있는지
  return { stemIdx: mod(startStemForIn + steps, 10), branchIdx: monthBranchIdx };
}

// 오서둔시법: 일간에 따라 자시(子時)의 천간이 정해지고, 이후 시지 순서대로 천간이 循環한다
function hourGanjiIndex(dayStemIdx, hour) {
  const branchIdx = hour === 23 || hour === 0 ? 0 : mod(Math.floor((hour + 1) / 2), 12);
  const startStemForJa = mod(2 * mod(dayStemIdx, 5), 10);
  return { stemIdx: mod(startStemForJa + branchIdx, 10), branchIdx };
}

// birthInfo: { date: "YYYY-MM-DD"(양력), time: "HH:MM" | null } (예전 버전에 있던 gender는 계산에 쓰지 않음)
function computeSaju(birthInfo) {
  if (!birthInfo || !birthInfo.date) return null;
  const [y, m, d] = birthInfo.date.split("-").map(Number);
  if (!y || !m || !d) return null;

  const year = yearGanjiIndex(y, m, d);
  const mBranch = monthBranchIndex(y, m, d);
  const month = monthGanjiIndex(year.stemIdx, mBranch);
  const dayIdx = dayGanjiIndex(y, m, d);
  const day = { stemIdx: mod(dayIdx, 10), branchIdx: mod(dayIdx, 12) };

  let hourPillar = null;
  if (birthInfo.time) {
    const [hh] = birthInfo.time.split(":").map(Number);
    if (Number.isFinite(hh)) hourPillar = hourGanjiIndex(day.stemIdx, hh);
  }

  const pillars = [year, month, day, hourPillar].filter(Boolean);
  // 여행운 항목을 사람마다 다르게 고르기 위한 숫자 (예: 1975-03-15 → 19750315)
  const seed = y * 10000 + m * 100 + d;
  const elementCounts = { 목: 0, 화: 0, 토: 0, 금: 0, 수: 0 };
  pillars.forEach((p) => {
    elementCounts[STEM_ELEMENT[p.stemIdx]] += 1;
    elementCounts[BRANCH_ELEMENT[p.branchIdx]] += 1;
  });

  return {
    year, month, day, hour: hourPillar,
    hasHour: !!hourPillar,
    labels: {
      year: ganjiLabel(year.stemIdx, year.branchIdx),
      month: ganjiLabel(month.stemIdx, month.branchIdx),
      day: ganjiLabel(day.stemIdx, day.branchIdx),
      hour: hourPillar ? ganjiLabel(hourPillar.stemIdx, hourPillar.branchIdx) : null,
    },
    elementCounts,
    seed,
  };
}

// 오늘 날짜의 일진(하루의 간지) - 여행운 카드에서 "오늘의 기운"으로 사용
function todayGanji() {
  const now = new Date();
  const idx = dayGanjiIndex(now.getFullYear(), now.getMonth() + 1, now.getDate());
  const stemIdx = mod(idx, 10);
  const branchIdx = mod(idx, 12);
  return { idx, stemIdx, branchIdx, element: STEM_ELEMENT[stemIdx], label: ganjiLabel(stemIdx, branchIdx) };
}

// 사람마다 다른 시작 위치(생년월일로 정함)에서 날마다 한 칸씩 넘어가며 고른다.
// 같은 사람·같은 날은 하루 종일 같은 결과가 나오고, 다음 날은 반드시 다른 항목이 나온다.
// salt를 항목마다 다르게 줘서 방향/색/아이템/문구가 같이 움직이지 않게 한다.
function pickPersonalDaily(list, personSeed, dayIdx, salt) {
  let h = Math.imul(personSeed ^ Math.imul(salt + 1, 0x9e3779b1), 0x85ebca6b);
  h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return list[mod((h >>> 0) + dayIdx, list.length)];
}

const GENERATES = { 목: "화", 화: "토", 토: "금", 금: "수", 수: "목" };

// 패턴별 헤드라인 템플릿 - {키워드} 자리에 오늘 오행의 성격 키워드가 들어간다

// 마지막 글자에 받침이 있으면 "을", 없으면 "를"을 붙인다 (예: 성장과 시작을 / 안정과 신뢰를)
function withObjectParticle(word) {
  const code = word.charCodeAt(word.length - 1) - 0xac00;
  const hasFinal = code >= 0 && code <= 11171 && code % 28 !== 0;
  return word + (hasFinal ? "을" : "를");
}

// 재미로 보는 오늘의 여행운 - 명식의 오행 분포와 오늘 일진의 오행을 비교해 4가지 패턴 중 하나를 고르고,
// 오행 키워드와 한 줄 문구 로테이션으로 매번 조금씩 다르게 표현한다.
// 전통 명리학 전문 풀이가 아니라, 방향/색상 같은 오행 배속을 가지고 가볍게 구성한 엔터테인먼트 콘텐츠.
function getTravelFortune(saju) {
  const today = todayGanji();
  const counts = saju.elementCounts;
  const maxCount = Math.max(...ELEMENTS.map((e) => counts[e]));
  const minCount = Math.min(...ELEMENTS.map((e) => counts[e]));
  const dominant = ELEMENTS.filter((e) => counts[e] === maxCount);
  const lacking = ELEMENTS.filter((e) => counts[e] === minCount);
  const todayEl = today.element;
  const theme = ELEMENT_THEME[todayEl];
  const keyword = ELEMENT_KEYWORD[todayEl];

  let mood;
  if (lacking.includes(todayEl) && minCount < maxCount) {
    mood = "fill";
  } else if (dominant.includes(todayEl) && maxCount > minCount) {
    mood = "overflow";
  } else if (dominant.some((e) => GENERATES[e] === todayEl)) {
    mood = "boost";
  } else {
    mood = "calm";
  }

  const headline = HEADLINE_TEMPLATES[mood](keyword);
  const seed = saju.seed || 0;

  return {
    todayLabel: today.label,
    todayElement: todayEl,
    mood,
    headline,
    direction: pickPersonalDaily(theme.direction, seed, today.idx, 1),
    colors: pickPersonalDaily(theme.colors, seed, today.idx, 2),
    item: pickPersonalDaily(theme.item, seed, today.idx, 3),
    oneLiner: pickPersonalDaily(ONE_LINER_POOL[mood], seed, today.idx, 4),
  };
}

function lookupRegion(table, name) {
  if (table[name]) return table[name];
  const city = name.split(" ")[0];
  return name.includes(" ") ? table[`${city} *`] || null : null;
}

function hashString(str) {
  let h = 2166136261;
  for (const ch of str) {
    h ^= ch.codePointAt(0);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// 뽑힌 지역의 분위기(감성/활기)에 맞는 곡 중에서 n곡을 고른다.
// key(여행지 + 날짜)로 고르기 때문에 앱을 다시 열어도 그날 그 여행지의 추천곡은 그대로다.
function pickSongsForTrip(arr, mood, n, key) {
  const filtered = arr.filter((s) => s.mood === mood);
  const list = filtered.length > 0 ? filtered : arr;
  const start = hashString(key) % list.length;
  return Array.from({ length: Math.min(n, list.length) }, (_, i) => list[(start + i) % list.length]);
}

function youtubeSearchUrl(song) {
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(`${song.title} ${song.artist}`)}`;
}

// 1-3. 하루 일정표 - 감성/활기 테마별 코스 + 출발 시간 추천 + 실제 장소(사진·길찾기·다른 곳 보기) + 축제
// ==========================================
// 이동 시간(분) - distanceEta와 같은 어림셈(직선거리 × 1.32를 평균 80km/h로)
function travelMinutes(from, to) {
  const roadKm = haversineKm(from.lat, from.lng, to.lat, to.lng) * 1.32;
  return Math.round((roadKm / 80) * 60);
}

function fmtClock(min) {
  const m = ((Math.round(min) % 1440) + 1440) % 1440;
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
}

function fmtDuration(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (h === 0) return `${m}분`;
  return m === 0 ? `${h}시간` : `${h}시간 ${m}분`;
}

const roundDown10 = (m) => Math.floor(m / 10) * 10;
const roundUp10 = (m) => Math.ceil(m / 10) * 10;

const COURSE_RULES = {
  // 감성은 느긋하게 10:30 도착, 활기는 09:30 도착을 목표로 거꾸로 출발 시간을 잡는다
  emotional: { label: "감성 코스", targetArrival: 10 * 60 + 30, cutoff: 18 * 60 + 30 },
  energetic: { label: "활기 코스", targetArrival: 9 * 60 + 30, cutoff: 19 * 60 + 30 },
};
const EARLIEST_DEPARTURE = 6 * 60; // 이보다 이른 출발은 권하지 않는다
const OVERNIGHT_TRAVEL = 4 * 60; // 편도 4시간 이상이면 1박 2일 추천
const LATE_HOME_ARRIVAL = 23 * 60 + 30; // 집에 이보다 늦게 도착하면 1박 2일 추천
const ISLAND_ARRIVAL = 11 * 60; // 섬은 배·비행기 시간에 따라 다르므로 11시 도착을 예시로 보여준다

// 출발·도착 시간 계산
function planTravel(from, spot) {
  const rule = COURSE_RULES[spot.mood] || COURSE_RULES.emotional;
  if (needsFerryOrFlight(from.name, spot.name)) {
    return { mode: "island", arrival: ISLAND_ARRIVAL, travel: null };
  }
  const travel = travelMinutes(from, spot);
  let departure = roundDown10(rule.targetArrival - travel);
  let arrival = rule.targetArrival;
  if (departure < EARLIEST_DEPARTURE) {
    departure = EARLIEST_DEPARTURE;
    arrival = roundUp10(departure + travel);
  }
  return { mode: "car", travel, departure, arrival };
}

// 후보 목록에서 slot마다 장소를 하나씩 고른다. 같은 장소가 두 번 나오지 않게 하고,
// '다른 곳 보기'를 누른 횟수(offset)만큼 다음 후보로 넘어간다.
function pickDistinct(candidates, slots, offsets, used) {
  const picked = {};
  slots.forEach(({ key, base }) => {
    if (!candidates || candidates.length === 0) return;
    const n = candidates.length;
    const start = base + (offsets[key] || 0);
    for (let i = 0; i < n; i++) {
      const c = candidates[(start + i) % n];
      if (!used.has(c.id)) {
        used.add(c.id);
        picked[key] = c;
        return;
      }
    }
  });
  return picked;
}

// 어디서나 갈 수 있는 프랜차이즈는 여행 일정 추천에서 뺀다
const CHAIN_BRANDS = /롯데리아|맥도날드|버거킹|맘스터치|KFC|서브웨이|빽다방|컴포즈|메가(MGC)?커피|이디야|스타벅스|투썸|할리스|파스쿠찌|엔제리너스|파리바게|뚜레쥬르|배스킨|던킨|교촌|BBQ|bhc|굽네|김밥천국|본죽|유가네|명랑핫도그|공차|더벤티|매머드/i;

// 음식점 목록을 식사(한식·중식 등)와 카페로 나누고, 체인점은 뺀다
function splitPlaces(data) {
  const notChain = (p) => !CHAIN_BRANDS.test(p.name);
  const restaurants = (data?.restaurants || []).filter(notChain);
  return {
    landmarks: data?.landmarks || [],
    meals: restaurants.filter((p) => !p.cafe),
    cafes: restaurants.filter((p) => p.cafe),
  };
}

function kakaoDirectionsUrl(name, lat, lng) {
  return lat && lng
    ? `https://map.kakao.com/link/to/${encodeURIComponent(name)},${lat},${lng}`
    : `https://map.kakao.com/?q=${encodeURIComponent(name)}`;
}

// 테마별 코스를 시간 순서대로 만든다. stay = 그 일정에 머무는 시간(분), notBefore = 이 시각 전에는 시작하지 않음
function buildDayPlan({ spot, arrival, data, offsets }) {
  const rule = COURSE_RULES[spot.mood] || COURSE_RULES.emotional;
  const { landmarks, meals, cafes } = splitPlaces(data);
  const festival = (data?.festivals || []).find((f) => f.status === "ongoing") || null;
  const used = new Set();
  const L = pickDistinct(landmarks, [{ key: "landmark-0", base: 0 }, { key: "landmark-1", base: 1 }, { key: "landmark-2", base: 2 }], offsets, used);
  const R = pickDistinct(meals, [{ key: "restaurant-0", base: 0 }, { key: "restaurant-1", base: 1 }, { key: "restaurant-2", base: 2 }], offsets, used);
  const C = pickDistinct(cafes, [{ key: "cafe-0", base: 0 }], offsets, used);
  const searchLinks = (keyword) => buildMapSearchLinks(spot, keyword);
  // 지역 별미가 있으면 점심 일정에 '○○ 맛집 찾기'를 붙인다
  const foods = lookupRegion(REGION_FOODS, spot.name);
  const foodLinks = foods
    ? [{ id: "food", label: `🍜 ${foods[0]} 맛집 찾기`, url: `https://map.kakao.com/?q=${encodeURIComponent(`${spot.name} ${foods[0]}`)}` }]
    : null;
  const festivalStep = festival && {
    icon: "🎉", title: "축제 즐기기", place: { ...festival, name: festival.title }, highlight: true,
    fallback: "", note: `지금 열리는 중 (${festival.shortPeriod})`,
  };

  const template = spot.mood === "energetic"
    ? [
        { icon: "🚩", title: "도착", fallback: `${spot.name} 도착! 바로 움직여 볼까요?`, stay: 10 },
        { icon: "🏛️", title: "명소 둘러보기", slot: "landmark-0", place: L["landmark-0"], fallback: `${spot.name}의 대표 명소를 둘러보세요.`, stay: 70 },
        { icon: "🏛️", title: "한 곳 더!", slot: "landmark-1", place: L["landmark-1"], fallback: "근처 볼거리를 하나 더 들러보세요.", stay: 70 },
        { icon: "🍽️", title: "점심 맛집", slot: "restaurant-0", place: R["restaurant-0"], fallback: "근처 맛집에서 든든하게 점심을 먹어요.", stay: 60, notBefore: 12 * 60, links: foodLinks },
        festivalStep
          ? { ...festivalStep, stay: 120 }
          : { icon: "🛍️", title: "시장·거리 구경", fallback: "전통시장이나 번화가를 걸으며 구경해요.", links: searchLinks("전통시장"), stay: 90 },
        C["cafe-0"]
          ? { icon: "🍡", title: "간식·카페 타임", slot: "cafe-0", place: C["cafe-0"], fallback: "", stay: 40 }
          : { icon: "🍡", title: "간식 타임", slot: "restaurant-1", place: R["restaurant-1"], fallback: "출출할 때 간식 한 곳 더!", stay: 40 },
        { icon: "🏛️", title: "마지막 볼거리", slot: "landmark-2", place: L["landmark-2"], fallback: "아직 못 본 곳을 하나 더 들러보세요.", stay: 70 },
        { icon: "🍖", title: "저녁 식사", slot: "restaurant-2", place: R["restaurant-2"], fallback: "여행을 마무리하는 저녁 한 끼.", stay: 80, notBefore: 18 * 60 },
      ]
    : [
        { icon: "🚩", title: "도착", fallback: `${spot.name}에 도착! 천천히 시작해요.`, stay: 20 },
        { icon: "🏛️", title: "명소 산책", slot: "landmark-0", place: L["landmark-0"], fallback: `${spot.name}의 대표 명소를 천천히 걸어보세요.`, stay: 100 },
        { icon: "🍽️", title: "점심 식사", slot: "restaurant-0", place: R["restaurant-0"], fallback: "근처 맛집에서 여유롭게 점심을 즐겨요.", stay: 80, notBefore: 12 * 60 + 30, links: foodLinks },
        festivalStep
          ? { ...festivalStep, stay: 90 }
          : { icon: "📚", title: "동네 서점 나들이", fallback: "동네 서점에 들러 책 한 권 골라보세요.", links: searchLinks("서점"), stay: 60 },
        { icon: "☕", title: "카페에서 쉬어가기", slot: "cafe-0", place: C["cafe-0"], fallback: "창가 자리에 앉아 잠시 쉬어가요.", links: C["cafe-0"] ? null : searchLinks("카페"), stay: 70 },
        { icon: "🌅", title: "해 질 무렵 산책", slot: "landmark-1", place: L["landmark-1"], fallback: "해 질 무렵 한 번 더 걸어보세요.", stay: 60, notBefore: 17 * 60 },
      ];

  const steps = [];
  let t = arrival;
  template.forEach((step, i) => {
    const start = Math.max(t, step.notBefore || 0);
    // 늦게 도착한 날은 마감 시간을 넘는 일정은 뺀다 (도착은 항상 보여줌)
    if (i > 0 && start > rule.cutoff) return;
    steps.push({ ...step, time: start });
    t = start + step.stay;
  });
  return { steps, end: roundUp10(t), upcomingFestival: !festival ? (data?.festivals || []).find((f) => f.status === "upcoming") : null };
}

function DayItinerary({ spot, from, entry, gayoSongs, popSongs, regionSong, onPlanPlaces, onRetry, petById }) {
  // 장소마다 '다른 곳 보기'를 누른 횟수 (부모에서 key={spot.id}로 여행지가 바뀌면 초기화)
  const [offsets, setOffsets] = useState({});
  const isLoading = !entry || entry.status === "loading";
  const data = entry && entry.status === "success" ? entry.data : null;
  const rule = COURSE_RULES[spot.mood] || COURSE_RULES.emotional;
  const travel = planTravel(from, spot);
  const plan = buildDayPlan({ spot, arrival: travel.arrival, data, offsets });
  // 일정에 들어간 장소를 부모에게 알려 '더 알아보기'에서 같은 곳이 또 나오지 않게 한다
  const planPlaceIds = plan.steps.filter((s) => s.place && s.place.id).map((s) => s.place.id).join(",");
  useEffect(() => {
    if (onPlanPlaces) onPlanPlaces(planPlaceIds);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [planPlaceIds]);
  const homeArrival = travel.mode === "car" ? roundUp10(plan.end + travel.travel) : null;
  const overnight = travel.mode === "island" || travel.travel >= OVERNIGHT_TRAVEL || (homeArrival !== null && homeArrival > LATE_HOME_ARRIVAL);
  // 후보가 같은 종류 칸 수보다 많아야 '다른 곳'으로 바꿀 여지가 있다
  const places = splitPlaces(data);
  const candidateCount = (slot) => {
    if (slot.startsWith("landmark")) return places.landmarks.length - 2;
    if (slot.startsWith("cafe")) return places.cafes.length;
    return places.meals.length - 2;
  };

  return (
    <div className="mt-4">
      <p className="text-xs font-medium text-[#2B2620] mb-2">
        오늘의 일정 · {spot.mood === "emotional" ? "🌙" : "⚡"} {rule.label}
      </p>

      {/* 출발 시간 추천 */}
      <div className="bg-white/50 border border-[#D9CBB0] rounded-lg px-3 py-2 mb-3">
        {travel.mode === "island" ? (
          <>
            <p className="text-sm font-bold text-[#2B2620]">⛴️✈️ 배·비행기 시간을 먼저 확인하세요</p>
            <p className="text-[11px] text-[#6B5F4F] mt-0.5">아래 일정은 {fmtClock(ISLAND_ARRIVAL)}에 도착했을 때의 예시예요.</p>
          </>
        ) : (
          <>
            <p className="text-sm font-bold text-[#2B2620]">
              🚗 {fmtClock(travel.departure)} 출발 추천 → {fmtClock(travel.arrival)} 도착
            </p>
            <p className="text-[11px] text-[#6B5F4F] mt-0.5">
              {from.name}에서 자동차로 약 {fmtDuration(travel.travel)} ·{" "}
              {travel.arrival > rule.targetArrival
                ? `너무 이른 출발이 되지 않게 ${fmtClock(EARLIEST_DEPARTURE)} 출발로 맞췄어요`
                : `${rule.label}는 ${fmtClock(rule.targetArrival)} 도착 기준`}
            </p>
            <p className="text-[11px] text-[#6B5F4F]">
              {overnight
                ? `🏠 당일로 돌아오면 ${homeArrival >= 1440 ? "다음 날 " : ""}${fmtClock(homeArrival)}쯤 도착해요. 하룻밤 묵어가는 걸 추천해요.`
                : `🏠 ${fmtClock(plan.end)}에 출발하면 ${fmtClock(homeArrival)}쯤 도착`}
            </p>
          </>
        )}
        {overnight && (
          <p className="inline-block mt-1.5 text-[11px] font-bold text-[#F6F1E7] bg-[#C4592F] rounded-full px-2 py-0.5">
            🛏️ 1박 2일 추천
          </p>
        )}
      </div>

      {isLoading && <p className="text-[11px] text-[#A6987F] mb-2">장소 정보를 불러오는 중…</p>}
      {(entry?.status === "error" || entry?.partial) && (
        <div className="text-[11px] text-[#A8441F] mb-2 flex items-center justify-between gap-2">
          <span>
            {entry.status === "error"
              ? `${entry.message} 아래는 기본 일정이에요.`
              : "일부 장소 정보를 불러오지 못했어요."}
          </span>
          {onRetry && (
            entry.retrying ? (
              <span className="shrink-0 text-[#6B5F4F]">다시 불러오는 중…</span>
            ) : (
              <button onClick={onRetry} className="shrink-0 font-bold text-[#2F6E68] border border-[#D9CBB0] rounded-full px-2 py-0.5">
                ↻ 다시 불러오기
              </button>
            )
          )}
        </div>
      )}

      <ul className="space-y-2">
        {plan.steps.map((s, i) => (
          <li key={i} className="flex gap-3">
            <span className="text-xs font-bold text-[#B8860B] w-11 shrink-0 pt-2">{fmtClock(s.time)}</span>
            <div
              className="flex-1 border rounded-lg px-3 py-2 min-w-0 flex gap-2"
              style={{ background: s.highlight ? "#FFF4D6" : "rgba(255,255,255,.5)", borderColor: s.highlight ? "#B8860B" : "#D9CBB0" }}
            >
              {s.place?.image && (
                <img
                  src={s.place.image}
                  alt=""
                  loading="lazy"
                  className="w-12 h-12 rounded-md object-cover shrink-0"
                  onError={(e) => retryLargeImage(e, s.place.imageLarge, (img) => { img.style.display = "none"; })}
                />
              )}
              <div className="min-w-0 flex-1">
                <p className="text-sm font-medium text-[#2B2620]">{s.icon} {s.title}</p>
                {s.place ? (
                  <p className="text-xs text-[#2B2620] truncate">
                    <span className="font-bold">{s.place.name}</span>
                    {s.place.distanceKm && <span className="text-[#6B5F4F]"> · 시내에서 {s.place.distanceKm}km</span>}
                  </p>
                ) : (
                  <p className="text-xs text-[#6B5F4F] line-clamp-1">{s.fallback}</p>
                )}
                {s.note && <p className="text-[11px] font-bold text-[#C4592F]">{s.note}</p>}
                {s.place && petById && petById.has(String(s.place.id)) && (
                  <p className="text-[11px] font-bold text-[#9A5B2E] line-clamp-1">🐶 반려동물 동반 · {petSummary(petById.get(String(s.place.id)))}</p>
                )}
                <div className="flex flex-wrap gap-x-3 gap-y-0.5 mt-1">
                  {s.place && (
                    <a href={kakaoDirectionsUrl(s.place.name, s.place.lat, s.place.lng)} target="_blank" rel="noreferrer" className="text-[11px] font-bold text-[#2F6E68]">
                      길찾기 ↗
                    </a>
                  )}
                  {s.slot && s.place && candidateCount(s.slot) > 1 && (
                    <button
                      onClick={() => setOffsets((prev) => ({ ...prev, [s.slot]: (prev[s.slot] || 0) + 1 }))}
                      className="text-[11px] text-[#6B5F4F]"
                    >
                      ↻ 다른 곳
                    </button>
                  )}
                  {s.links && s.links.map((l) => (
                    <a key={l.id} href={l.url} target="_blank" rel="noreferrer" className="text-[11px] text-[#2F6E68]">
                      {l.label}
                    </a>
                  ))}
                </div>
              </div>
            </div>
          </li>
        ))}
      </ul>

      {plan.upcomingFestival && (
        <a
          href={kakaoDirectionsUrl(plan.upcomingFestival.title, plan.upcomingFestival.lat, plan.upcomingFestival.lng)}
          target="_blank"
          rel="noreferrer"
          className="block mt-2 text-[11px] text-[#6B5F4F] bg-white/40 border border-dashed border-[#D9CBB0] rounded-lg px-3 py-2"
        >
          📅 곧 열려요: <span className="font-bold text-[#2B2620]">{plan.upcomingFestival.title}</span> ({plan.upcomingFestival.shortPeriod})
        </a>
      )}

      <p className="text-xs font-medium text-[#2B2620] mt-4 mb-2 flex items-center gap-1">
        <Music size={12} /> 오늘의 추천 음악
      </p>
      {/* 그 지역을 노래한 곡이 있으면 맨 앞에 크게 보여준다 */}
      {regionSong && (
        <a
          href={youtubeSearchUrl(regionSong)}
          target="_blank"
          rel="noreferrer"
          className="block mb-2 rounded-lg px-3 py-2 border border-[#B8860B]"
          style={{ background: "#FFF4D6" }}
        >
          <p className="text-[10px] text-[#B8860B] font-bold flex items-center justify-between">
            🎵 {spot.name} 노래
            <span className="text-[#C4592F]">▶ 듣기</span>
          </p>
          <p className="text-sm text-[#2B2620] font-bold truncate">{regionSong.title}</p>
          <p className="text-xs text-[#6B5F4F] truncate">{regionSong.artist}</p>
        </a>
      )}
      {/* 곡 카드를 누르면 유튜브에서 그 곡을 검색한다 (폰에서는 유튜브 앱으로 열림) */}
      <div className="grid grid-cols-2 gap-2">
        {[...gayoSongs.map((s) => ["가요", s]), ...popSongs.map((s) => ["팝송", s])].map(([kind, s], i) => (
          <a
            key={`${kind}${i}`}
            href={youtubeSearchUrl(s)}
            target="_blank"
            rel="noreferrer"
            className="block bg-white/50 border border-[#D9CBB0] rounded-lg px-3 py-2 min-w-0"
          >
            <p className="text-[10px] text-[#A6987F] flex items-center justify-between">
              {kind}
              <span className="flex items-center gap-0.5 text-[#C4592F]">▶ 듣기</span>
            </p>
            <p className="text-sm text-[#2B2620] truncate">{s.title}</p>
            <p className="text-xs text-[#6B5F4F] truncate">{s.artist}</p>
          </a>
        ))}
      </div>
    </div>
  );
}

// ==========================================
// 1-1. 외부 API 연동 레이어
// 주의: 브라우저(클라이언트)에서 직접 호출하는 데모 구현입니다.
// - 구글 커스텀 검색(Custom Search JSON API)은 2026년부터 신규 프로젝트에는 접근이
//   막혀 있어(공식 정책 변경) 더 이상 사용하지 않습니다. 대신 명소·맛집·축제는 전부
//   한국관광공사 TourAPI(공공데이터포털)의 위치기반 조회로 대체했습니다.
// - 서점/카페는 TourAPI에 해당 카테고리가 없어(관광시설 위주 분류), 네이버/카카오
//   지도 검색으로 바로 연결되는 링크만 제공합니다 (API 호출 없이 URL만 구성).
// - 공공데이터포털 API는 브라우저에서 직접 fetch하면 CORS로 막히는 경우가 있습니다.
//   프로덕션에서는 자체 백엔드에서 프록시하는 것을 권장합니다.
// ==========================================

function haversineKm(lat1, lng1, lat2, lng2) {
  const p = 0.017453292519943295;
  const a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 +
    Math.cos(lat1 * p) * Math.cos(lat2 * p) * (1 - Math.cos((lng2 - lng1) * p)) / 2;
  return 12742 * Math.asin(Math.sqrt(a));
}

// 서비스키는 이제 클라이언트에 전혀 없다 - Netlify Function(/api/tourapi)이
// 서버 환경변수(TOUR_API_SERVICE_KEY)로 대신 TourAPI를 호출하고 결과만 돌려준다.
// 같은 요청(일정표와 '더 알아보기'가 같은 명소 목록을 원할 때 등)은 한 번만 보내고 결과를 나눠 쓴다.
// 실패한 요청은 기억하지 않아 다음에 다시 시도한다.
const tourApiRequestCache = new Map();
function tourApiProxyFetch(action, extraParams) {
  const key = new URLSearchParams({ action, ...extraParams }).toString();
  if (!tourApiRequestCache.has(key)) {
    const promise = tourApiProxyFetchOnce(action, extraParams);
    tourApiRequestCache.set(key, promise);
    promise.catch(() => tourApiRequestCache.delete(key));
  }
  return tourApiRequestCache.get(key);
}

async function tourApiProxyFetchOnce(action, extraParams) {
  const params = new URLSearchParams({ action, ...extraParams });
  const url = `/api/tourapi?${params.toString()}`;
  // 공공데이터 서버가 가끔 응답하지 않거나(522 등) 아예 멈춰 있어서, 12초 안에 답이 없으면 끊고
  // 서버 쪽 오류·시간 초과면 잠시 뒤 한 번 더 시도한다 (안 그러면 '불러오는 중'에서 멈춰 버린다)
  const fetchWithTimeout = async () => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    try {
      return await fetch(url, { signal: controller.signal });
    } catch {
      return null; // 시간 초과 또는 네트워크 오류
    } finally {
      clearTimeout(timer);
    }
  };
  let res = await fetchWithTimeout();
  if (!res || res.status >= 500) {
    await new Promise((r) => setTimeout(r, 1200));
    res = await fetchWithTimeout();
  }
  if (!res) {
    const err = new Error("관광정보 서버가 응답하지 않아요.");
    err.code = "HTTP_ERROR";
    throw err;
  }
  let data = null;
  try {
    data = await res.json();
  } catch {
    // 응답이 JSON이 아니면 아래에서 HTTP 상태 기반 에러로 처리
  }
  if (!res.ok || (data && data.error)) {
    const isServerNoKey = data && data.error === "SERVER_NO_KEY";
    // 서버(Netlify Function)가 진단용으로 넣어준 상세 메시지 + TourAPI 원본 응답을 그대로 보여준다
    let detail = data && data.message ? data.message : `공공데이터 API 응답 오류 (HTTP ${res.status})`;
    if (data && data.upstreamBody) {
      detail += ` — 원본 응답: ${data.upstreamBody}`;
    }
    const err = new Error(detail);
    err.code = isServerNoKey ? "SERVER_NO_KEY" : "HTTP_ERROR";
    throw err;
  }
  return (data && data.items) || [];
}

// 명소(contentTypeId=12) / 맛집(contentTypeId=39)을 위경도 기반으로 가까운 순 조회
// 가까운 순으로 30곳을 받아 온다. 가장 가까운 곳이 관광지가 아닌 단체 사무실 같은 곳일 때가 많아서,
// preferImages면 사진이 등록된 곳(대부분 실제 볼거리)을 앞으로 올린다 (각 그룹 안에서는 가까운 순 유지).
async function fetchNearbyTourSpots({ lat, lng, contentTypeId, radius = 20000, num = 5, preferImages = false }) {
  const arr = await tourApiProxyFetch("nearby", {
    lat: String(lat),
    lng: String(lng),
    contentTypeId: String(contentTypeId),
    radius: String(radius),
    num: String(Math.max(num, 30)),
  });
  // 관광지(12)로 등록됐지만 볼거리가 아닌 곳(화장실, 사우나, 노인회 사무실 등)은 뺀다
  const cleaned = contentTypeId === 12 ? arr.filter((it) => !NOT_ATTRACTION.test(it.title || "")) : arr;
  const ordered = preferImages ? [...cleaned.filter((it) => it.firstimage), ...cleaned.filter((it) => !it.firstimage)] : cleaned;
  return dedupeByName(ordered).slice(0, num).map((it) => ({
    id: it.contentid,
    name: it.title,
    kind: PLACE_KIND_LABELS[it.cat3] || LANDMARK_KIND_LABELS[it.cat2] || "",
    address: it.addr1 || "",
    distanceKm: it.dist ? (parseFloat(it.dist) / 1000).toFixed(1) : null,
    lat: parseFloat(it.mapy) || null,
    lng: parseFloat(it.mapx) || null,
    image: toHttps(it.firstimage2 || it.firstimage),
    imageLarge: toHttps(it.firstimage), // 작은 사진(firstimage2)이 깨진 경우가 있어 대신 쓸 큰 사진
    cafe: it.cat3 === "A05020900", // 음식점(39) 안의 '카페/전통찻집' 분류
  }));
}

const NOT_ATTRACTION = /화장실|사우나|노인회|경로당|주차장|복지관|주민센터|행정복지/;

// 관광정보에는 같은 곳이 이름만 조금 다르게 여러 번 등록된 경우가 많다
// (예: '진미반점'이 두 번, '인사동'/'안녕인사동', '흥국사(여수)'/'여수 흥국사 홍교', '용연'/'용연구름다리').
// 괄호·띄어쓰기를 뺀 이름이 같거나 한쪽이 다른 쪽에 들어 있으면 같은 곳으로 보고 앞의 것만 남긴다
// (앞쪽이 사진 있는 곳·가까운 곳이라 그쪽을 남긴다).
function placeKey(title) {
  return (title || "").replace(/\(.*?\)|\[.*?\]/g, "").replace(/[\s·.,'"-]/g, "");
}
function dedupeByName(items) {
  const kept = [];
  const keys = [];
  items.forEach((it) => {
    const k = placeKey(it.title);
    if (!k) return;
    if (keys.some((m) => m === k || m.includes(k) || k.includes(m))) return;
    keys.push(k);
    kept.push(it);
  });
  return kept;
}

// 관광정보 분류 코드 → 화면에 보여줄 종류 배지 (2026-10-02 실제 응답으로 확인)
const PLACE_KIND_LABELS = {
  // 음식점(39)
  A05020100: "한식", A05020200: "양식", A05020300: "일식", A05020400: "중식", A05020700: "이색음식", A05020900: "카페",
  // 숙박(32)
  B02010100: "호텔", B02010500: "콘도", B02010600: "유스호스텔", B02010700: "펜션", B02010900: "모텔",
  B02011000: "민박", B02011100: "게스트하우스", B02011200: "홈스테이", B02011300: "레지던스", B02011600: "한옥",
  // 문화시설(14)
  A02060100: "박물관", A02060200: "기념관", A02060300: "전시관", A02060500: "미술관", A02060600: "공연장",
  A02060700: "문화원", A02060900: "도서관", A02061000: "서점", A02061200: "영화관",
};
// 관광지(12)는 중분류로 표시
const LANDMARK_KIND_LABELS = { A0101: "자연", A0102: "관광자원", A0201: "역사", A0202: "휴양", A0203: "체험", A0204: "산업", A0205: "건축" };

// 관광정보 사진 주소가 http로 오는데, https 페이지(앱)에서는 막힐 수 있어 https로 바꾼다 (같은 서버가 https 지원)
function toHttps(url) {
  return url ? url.replace(/^http:\/\//, "https://") : null;
}

// 사진이 안 열리면 큰 사진(imageLarge)으로 한 번 더 시도하고, 그래도 안 되면 onFail
// (관광정보의 작은 사진 주소가 404인 곳이 있다. 예: 서울 중구 카페 '호랑이')
function retryLargeImage(e, large, onFail) {
  const img = e.currentTarget;
  if (large && img.dataset.triedLarge !== "1") {
    img.dataset.triedLarge = "1";
    img.src = large;
  } else {
    onFail(img);
  }
}

function yyyymmdd(d) {
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
}

// 전국 축제 목록은 한 달 단위로 한 번만 받아서 여러 지역이 같이 쓴다 (API 호출 수 절약).
// 예전에는 가나다순 30개만 받아서 대부분 지역에 축제가 있어도 '없음'으로 나왔다.
let festivalListCache = { key: null, promise: null };
function loadFestivalList() {
  const today = new Date();
  const eventStartDate = `${yyyymmdd(today).slice(0, 6)}01`;
  if (festivalListCache.key !== eventStartDate || !festivalListCache.promise) {
    const promise = tourApiProxyFetch("festival", { eventStartDate, numOfRows: "1000" });
    festivalListCache = { key: eventStartDate, promise };
    promise.catch(() => { festivalListCache = { key: null, promise: null }; }); // 실패하면 다음에 다시 시도
  }
  return festivalListCache.promise;
}

// 축제(contentTypeId 없이 searchFestival2 사용) - 진행 중/예정 축제 중 거리순으로 가까운 것만 추림
// 여행지 주변 20km의 반려동물 동반 가능 장소 (서버가 전국 반려동물 목록과 주변 장소를 맞춰서 보내준다)
const CONTENT_TYPE_LABELS = { "12": "명소", "14": "문화", "28": "레포츠", "32": "숙소", "38": "쇼핑", "39": "음식점" };
// 여행 추천답게 볼거리·놀거리를 먼저, 쇼핑(애견용품점·편의점 등)은 뒤로. 같은 순위 안에서는 사진 있는 곳 → 가까운 곳 순
const PET_TYPE_RANK = { "12": 0, "28": 0, "39": 1, "14": 1, "32": 2, "38": 3 };
async function fetchPetNearby({ lat, lng }) {
  const arr = await tourApiProxyFetch("petNearby", { lat: String(lat), lng: String(lng) });
  const ranked = [...arr].sort((a, b) =>
    (PET_TYPE_RANK[a.contenttypeid] ?? 2) - (PET_TYPE_RANK[b.contenttypeid] ?? 2) ||
    (b.firstimage ? 1 : 0) - (a.firstimage ? 1 : 0) ||
    parseFloat(a.dist) - parseFloat(b.dist)
  );
  return dedupeByName(ranked).map((it) => ({
    id: it.contentid,
    name: it.title,
    kind: it.cat3 === "A05020900" ? "카페" : CONTENT_TYPE_LABELS[it.contenttypeid] || "",
    address: it.addr1 || "",
    distanceKm: it.dist ? (parseFloat(it.dist) / 1000).toFixed(1) : null,
    lat: parseFloat(it.mapy) || null,
    lng: parseFloat(it.mapx) || null,
    image: toHttps(it.firstimage2 || it.firstimage),
    imageLarge: toHttps(it.firstimage), // 작은 사진(firstimage2)이 깨진 경우가 있어 대신 쓸 큰 사진
    pet: it.pet,
  }));
}

// 반려동물 동반 조건을 한 줄로 (예: "전구역 동반가능 · 목줄 착용")
function petSummary(pet) {
  if (!pet) return "";
  return [pet.area, pet.need].filter(Boolean).join(" · ") || "동반 가능";
}

async function fetchLocalFestivals({ regionKeyword, lat, lng }) {
  const todayStr = yyyymmdd(new Date());
  const all = await loadFestivalList();
  // 이미 끝난 축제는 뺀다
  const arr = all.filter((it) => !it.eventenddate || it.eventenddate >= todayStr);

  const withDistance = arr.map((it) => {
    const itLat = parseFloat(it.mapy);
    const itLng = parseFloat(it.mapx);
    const dist = Number.isFinite(itLat) && Number.isFinite(itLng) ? haversineKm(lat, lng, itLat, itLng) : Infinity;
    return { it, dist };
  });

  // 1순위: 반경 60km 이내, 거리순
  let picked = withDistance.filter((x) => x.dist <= 60).sort((a, b) => a.dist - b.dist);
  // 2순위: 그래도 없으면 주소 문자열에 지역명이 포함된 항목
  if (picked.length === 0) {
    const shortRegion = (regionKeyword || "").replace(/(시|군|구)$/, "");
    picked = withDistance.filter((x) => shortRegion && (x.it.addr1 || "").includes(shortRegion));
  }
  // 그래도 없으면 전국 목록을 보여주지 않고 "없음"으로 처리 (엉뚱한 지역 축제가 나오지 않도록)

  const fmt = (s) => (s && s.length === 8 ? `${Number(s.slice(4, 6))}.${Number(s.slice(6, 8))}` : "");
  return picked.slice(0, 5).map(({ it, dist }) => ({
    id: it.contentid,
    title: it.title,
    period: it.eventstartdate && it.eventenddate ? `${it.eventstartdate} ~ ${it.eventenddate}` : "일정 미정",
    shortPeriod: it.eventstartdate && it.eventenddate ? `${fmt(it.eventstartdate)}~${fmt(it.eventenddate)}` : "",
    // 오늘 열리는 중인지(ongoing), 앞으로 열리는지(upcoming)
    status: it.eventstartdate && it.eventstartdate <= todayStr ? "ongoing" : "upcoming",
    location: it.addr1 || "위치 정보 없음",
    distanceKm: Number.isFinite(dist) ? dist.toFixed(1) : null,
    lat: parseFloat(it.mapy) || null,
    lng: parseFloat(it.mapx) || null,
    image: toHttps(it.firstimage2 || it.firstimage),
    imageLarge: toHttps(it.firstimage), // 작은 사진(firstimage2)이 깨진 경우가 있어 대신 쓸 큰 사진
  }));
}

// 서점/카페는 TourAPI 분류에 없어 지도 앱 검색으로 바로 연결만 해준다 (API 호출 없음)
function buildMapSearchLinks(spot, keyword) {
  const q = encodeURIComponent(`${spot.name} ${keyword}`);
  return [
    { id: "naver", label: "네이버 지도에서 찾기", url: `https://map.naver.com/p/search/${q}` },
    { id: "kakao", label: "카카오맵에서 찾기", url: `https://map.kakao.com/?q=${q}` },
  ];
}

// ==========================================
// 2. 룰렛 휠 (SVG)
// ==========================================
function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function sliceDPath(cx, cy, r, startDeg, endDeg) {
  const start = polarToCartesian(cx, cy, r, endDeg);
  const end = polarToCartesian(cx, cy, r, startDeg);
  const largeArc = endDeg - startDeg <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}

// 룰렛판 칸 수. 짝수여야 감성(파랑)/활기(빨강)가 한 바퀴 끝까지 번갈아 이어지고(홀수면 처음과 끝 칸이 같은 색으로 붙음),
// 각 테마 칸 수(9)가 팔레트 색 수(3)로 나누어떨어져야 색 순서도 이음매 없이 이어진다.
const ROULETTE_SIZE = 18;

const BLUE_PALETTE = ["#AFC9EA", "#C7DAF2", "#98BBE2"];
const RED_PALETTE = ["#F0B3AE", "#F5C9C5", "#EAA19B"];

// 머리 부분 로고 옆에서 계속 천천히 도는 작은 룰렛. 아래 큰 룰렛이 돌 때(fast)는 같이 빨라진다.
// 폰에서 가볍게 돌도록 CSS 애니메이션(GPU 처리)을 쓴다: 바깥 판은 늘 6초에 한 바퀴, fast일 때만
// 안쪽 판이 0.5초에 한 바퀴 더 돌아서 합쳐져 빨라 보인다. ('움직임 줄이기' 사용자는 CSS에서 멈춤)
const MINI_SLICE_COLORS = ["#AFC9EA", "#F0B3AE", "#C7DAF2", "#F5C9C5", "#98BBE2", "#EAA19B", "#AFC9EA", "#F0B3AE"];
function MiniRoulette({ size = 40, fast = false }) {
  const n = MINI_SLICE_COLORS.length;
  return (
    <div style={{ position: "relative", width: size, height: size + 6, flexShrink: 0 }} aria-hidden="true">
      <svg viewBox="0 0 26 40" width={size * 0.28} height={size * 0.38} style={{ position: "absolute", left: "50%", top: 0, transform: "translateX(-50%)", zIndex: 1 }}>
        <path d="M3 13 L13 38 L23 13 Z" fill="#DC2626" />
        <circle cx="13" cy="12" r="10" fill="#DC2626" />
        <circle cx="13" cy="12" r="4" fill="#F6F1E7" />
      </svg>
      <div className="mini-roulette-spin" style={{ position: "absolute", left: 0, top: 6, width: size, height: size }}>
        <svg viewBox="0 0 100 100" width={size} height={size} className={fast ? "mini-roulette-fast" : ""} style={{ display: "block" }}>
          {MINI_SLICE_COLORS.map((c, i) => (
            <path key={i} d={sliceDPath(50, 50, 47, (i * 360) / n, ((i + 1) * 360) / n)} fill={c} stroke="#F6F1E7" strokeWidth="1.5" />
          ))}
          <circle cx="50" cy="50" r="47" fill="none" stroke="#B8860B" strokeWidth="3" />
          <circle cx="50" cy="50" r="12" fill="#2B2620" stroke="#F6F1E7" strokeWidth="3" />
        </svg>
      </div>
    </div>
  );
}

function RouletteWheel({ spots, wheelRef }) {
  const cx = 150, cy = 150, r = 140;
  const n = spots.length;
  const vertical = true; // 감성/활기 여행 룰렛 모두 지역명을 세로로 표기
  const labelColor = "#2B2620"; // 팔레트가 연해져서 밝은 글씨 대신 진한 잉크색 사용
  if (n === 0) return null;
  const sweep = 360 / n;
  const lineHeight = 12;
  // 슬라이스마다 색을 감성(파랑)/활기(빨강)의 각자 팔레트에서 순환시켜, 두 테마가 사이사이에 섞여 보이도록 함
  let blueCounter = 0, redCounter = 0;

  return (
    <div ref={wheelRef} style={{ transform: "rotate(0deg)", willChange: "transform" }} className="w-full h-full">
      <svg viewBox="0 0 300 300" className="w-full h-full">
        {spots.map((s, i) => {
          const start = i * sweep;
          const end = start + sweep;
          const mid = start + sweep / 2;
          const labelPos = polarToCartesian(cx, cy, r * (vertical ? 0.62 : 0.66), mid);
          const chars = vertical ? Array.from(s.name.replace(/\s/g, "")) : null;
          const startY = vertical ? labelPos.y - ((chars.length - 1) * lineHeight) / 2 : 0;
          const palette = s.mood === "emotional" ? BLUE_PALETTE : RED_PALETTE;
          const fillColor = s.mood === "emotional" ? palette[blueCounter++ % palette.length] : palette[redCounter++ % palette.length];
          return (
            <g key={s.id}>
              <path d={sliceDPath(cx, cy, r, start, end)} fill={fillColor} stroke="#F6F1E7" strokeWidth="1.5" />
              {vertical ? (
                // 세로로 쌓은 글자 블록을 섹터의 중심 각도(mid)만큼 회전시켜, 부채꼴 모양(방사형)에 맞춰 눕힌다.
                // (참고: <tspan>은 SVG에서 transform 속성을 지원하지 않아 괄호만 따로 돌릴 수 없으므로,
                //  글자 하나하나를 <text>로 각각 그려서 필요한 글자에만 개별 회전을 줄 수 있게 한다.)
                <g transform={`rotate(${mid}, ${labelPos.x}, ${labelPos.y})`}>
                  {chars.map((c, ci) => {
                    const y = startY + ci * lineHeight;
                    // 세로쓰기에서 괄호를 그대로 쌓으면 옆으로 누운 모양이 되어 어색하므로,
                    // 90도 돌려서 여는 괄호는 위에서 감싸는 캡(⌢), 닫는 괄호는 아래에서 받치는
                    // 캡(⌣) 모양이 되도록 한다 (세로쓰기 조판에서 흔히 쓰는 방식)
                    const isParen = c === "(" || c === ")";
                    return (
                      <text
                        key={ci}
                        x={labelPos.x}
                        y={y}
                        fill={labelColor}
                        fontSize="11"
                        fontWeight="700"
                        textAnchor="middle"
                        {...(isParen ? { transform: `rotate(90, ${labelPos.x}, ${y})` } : {})}
                      >
                        {c}
                      </text>
                    );
                  })}
                </g>
              ) : (
                <text
                  x={labelPos.x} y={labelPos.y}
                  fill={labelColor} fontSize="11" fontWeight="700"
                  textAnchor="middle"
                  transform={`rotate(${mid}, ${labelPos.x}, ${labelPos.y})`}
                >
                  {s.name}
                </text>
              )}
            </g>
          );
        })}
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#B8860B" strokeWidth="2" />
      </svg>
    </div>
  );
}

// ==========================================
// 3. 위치 검색 다이얼로그
// ==========================================
// 폰 위치(GPS)에서 가장 가까운 시·군·구를 찾는다 (각 지역의 대표 좌표 기준이라 경계 근처에선 옆 지역이 나올 수 있음)
function findNearestLocation(lat, lng) {
  let best = null;
  let bestKm = Infinity;
  LOCATIONS.forEach((l) => {
    const km = haversineKm(lat, lng, l.lat, l.lng);
    if (km < bestKm) {
      best = l;
      bestKm = km;
    }
  });
  return best;
}

function LocationDialog({ currentLocation, onSelect, onClose }) {
  const [query, setQuery] = useState("");
  const [gpsStatus, setGpsStatus] = useState(""); // "" | "loading" | 오류 문구

  function locateMe() {
    if (!navigator.geolocation) {
      setGpsStatus("이 기기에서는 위치를 찾을 수 없어요. 직접 검색해 주세요.");
      return;
    }
    setGpsStatus("loading");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const nearest = findNearestLocation(pos.coords.latitude, pos.coords.longitude);
        setGpsStatus("");
        if (nearest) onSelect(nearest);
      },
      (err) => {
        setGpsStatus(
          err.code === 1
            ? "위치 권한이 꺼져 있어요. 폰 설정에서 위치 권한을 허용하거나 직접 검색해 주세요."
            : "위치를 찾지 못했어요. 잠시 후 다시 시도하거나 직접 검색해 주세요."
        );
      },
      { enableHighAccuracy: false, timeout: 15000, maximumAge: 5 * 60 * 1000 }
    );
  }
  const filtered = useMemo(() => {
    const q = query.replace(/\s/g, "");
    return LOCATIONS.filter((l) => l.name.replace(/\s/g, "").includes(q));
  }, [query]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
      <div className="w-full max-w-sm bg-[#F6F1E7] rounded-2xl border border-[#D9CBB0] flex flex-col max-h-[80vh]">
        <div className="flex items-center justify-between px-5 pt-5 pb-3">
          <h2 className="font-serif text-lg text-[#2B2620]">내 위치 검색</h2>
          <button onClick={onClose} aria-label="닫기" className="text-[#6B5F4F]">
            <X size={18} />
          </button>
        </div>
        <div className="px-5 pb-3">
          <div className="flex items-center gap-2 bg-white/60 border border-[#D9CBB0] rounded-lg px-3 py-2">
            <Search size={16} className="text-[#6B5F4F]" />
            <input
              autoFocus
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="지역명 입력 (예: 강릉, 해운대)"
              className="flex-1 bg-transparent outline-none text-sm text-[#2B2620] placeholder:text-[#A6987F]"
            />
          </div>
          <button
            onClick={locateMe}
            disabled={gpsStatus === "loading"}
            className="w-full mt-2 flex items-center justify-center gap-1.5 py-2 rounded-lg text-sm font-bold text-[#2B2620] border border-[#B8860B] bg-white/50 disabled:opacity-60"
          >
            {gpsStatus === "loading" ? (
              <><Loader2 size={14} className="animate-spin" /> 위치 찾는 중…</>
            ) : (
              <><MapPin size={14} className="text-[#B8860B]" /> 지금 있는 곳으로 설정</>
            )}
          </button>
          {gpsStatus && gpsStatus !== "loading" && <p className="text-xs text-[#DC2626] mt-2">{gpsStatus}</p>}
          <p className="text-xs text-[#6B5F4F] mt-2">{filtered.length}개 지역</p>
        </div>
        <div className="overflow-y-auto px-2 pb-4">
          {filtered.length === 0 ? (
            <p className="text-center text-sm text-[#6B5F4F] py-8">검색 결과가 없습니다.</p>
          ) : (
            filtered.map((loc) => {
              const isCurrent = loc.name === currentLocation.name;
              return (
                <button
                  key={loc.name}
                  onClick={() => onSelect(loc)}
                  className="w-full flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-white/60 text-left"
                >
                  <span className="text-sm text-[#2B2620]">{loc.name}</span>
                  {isCurrent && <Check size={16} className="text-[#2F6E68]" />}
                </button>
              );
            })
          )}
        </div>
      </div>
    </div>
  );
}

// ==========================================
// 3-1. 생년월일/생시/성별 입력 모달 (여행사주용, 최초 1회)
// ==========================================
// 음력→양력 변환 라이브러리(solarlunar, ISC 라이선스)를 HTML에서 CDN 스크립트로 불러와
// window.solarLunar 전역으로 접근한다 (UMD 빌드라 default export가 한 겹 더 감싸져 있을 수 있음).
function getSolarLunarLib() {
  if (typeof window === "undefined" || !window.solarLunar) return null;
  return window.solarLunar.default || window.solarLunar;
}

// 태어난 시간은 사주에서 2시간 단위(12지)로만 쓰이므로, 분 단위 대신 12개 중 하나를 고르게 한다.
// 저장 형식은 예전과 같은 "HH:MM"을 유지한다 (각 시진의 대표 시각: 자시 00:00, 축시 01:00, 인시 03:00 …).
const BIRTH_HOUR_OPTIONS = [
  { label: "자", range: "23~01시" }, { label: "축", range: "01~03시" }, { label: "인", range: "03~05시" },
  { label: "묘", range: "05~07시" }, { label: "진", range: "07~09시" }, { label: "사", range: "09~11시" },
  { label: "오", range: "11~13시" }, { label: "미", range: "13~15시" }, { label: "신", range: "15~17시" },
  { label: "유", range: "17~19시" }, { label: "술", range: "19~21시" }, { label: "해", range: "21~23시" },
];

function branchToTime(branchIdx) {
  const hour = branchIdx === 0 ? 0 : branchIdx * 2 - 1;
  return `${String(hour).padStart(2, "0")}:00`;
}

// 예전 버전에서 분 단위로 저장한 시간("14:30" 등)도 hourGanjiIndex와 같은 규칙으로 시진 번호로 바꾼다
function timeToBranch(time) {
  if (!time) return null;
  const hh = Number(time.split(":")[0]);
  if (!Number.isFinite(hh)) return null;
  return hh === 23 || hh === 0 ? 0 : Math.floor((hh + 1) / 2) % 12;
}

function daysInSolarMonth(year, month) {
  return new Date(Number(year) || 2000, Number(month), 0).getDate();
}

function BirthInfoModal({ initial, onSave, onClose }) {
  const [calendarType, setCalendarType] = useState(initial?.calendarType || "solar"); // "solar" | "lunar"
  const initialDate = (calendarType === "lunar" ? initial?.lunarDate : initial?.date) || "";
  const [iy, im, id] = initialDate ? initialDate.split("-") : ["", "", ""];
  const [year, setYear] = useState(iy || "");
  const [month, setMonth] = useState(im ? String(Number(im)) : "");
  const [day, setDay] = useState(id ? String(Number(id)) : "");
  const [isLeapMonth, setIsLeapMonth] = useState(!!initial?.isLeapMonth);
  const [branch, setBranch] = useState(timeToBranch(initial?.time)); // null = 시간 모름
  const [error, setError] = useState("");

  const thisYear = new Date().getFullYear();
  // 1990년대 생이 목록 위쪽에 오도록 올해부터 거꾸로 나열
  const years = useMemo(() => Array.from({ length: thisYear - 1919 }, (_, i) => String(thisYear - i)), [thisYear]);
  // 음력은 한 달이 29일 또는 30일이라 30일까지 보여주고, 실제로 있는 날짜인지는 저장할 때 변환 라이브러리로 확인한다
  const maxDay = calendarType === "lunar" ? 30 : month ? daysInSolarMonth(year, month) : 31;
  const days = Array.from({ length: maxDay }, (_, i) => String(i + 1));
  const complete = year && month && day;

  // 년/월이 바뀌어 고른 날짜가 그 달에 없으면(예: 양력 2월 30일) 날짜 선택을 비운다
  useEffect(() => {
    if (day && Number(day) > maxDay) setDay("");
  }, [maxDay]);

  function changeCalendarType(next) {
    if (next === calendarType) return;
    setCalendarType(next);
    setError("");
    setIsLeapMonth(false);
  }

  function handleSave() {
    if (!complete) return;
    const date = `${year}-${month.padStart(2, "0")}-${day.padStart(2, "0")}`;
    const timeValue = branch === null ? null : branchToTime(branch);

    if (calendarType === "solar") {
      onSave({ date, time: timeValue, calendarType: "solar" });
      return;
    }

    // 음력 입력 - solarlunar 라이브러리로 양력으로 변환한 뒤, 변환된 양력 날짜를 저장한다
    // (사주 계산 로직 자체는 계속 양력 기준으로 동작)
    const lib = getSolarLunarLib();
    if (!lib) {
      setError("음력 변환 기능을 아직 불러오는 중이에요. 잠시 후 다시 시도해주세요.");
      return;
    }
    const result = lib.lunar2solar(Number(year), Number(month), Number(day), isLeapMonth);
    if (!result || result === -1 || !result.cYear) {
      setError("음력 달력에 없는 날짜예요. 날짜(29일/30일)나 윤달 여부를 다시 확인해주세요.");
      return;
    }
    const solarDate = `${result.cYear}-${String(result.cMonth).padStart(2, "0")}-${String(result.cDay).padStart(2, "0")}`;
    onSave({
      date: solarDate,
      time: timeValue,
      calendarType: "lunar",
      lunarDate: date,
      isLeapMonth,
    });
  }

  const selectClass = "bg-white/70 border border-[#D9CBB0] rounded-lg px-2 py-2 text-sm text-[#2B2620] outline-none";
  const toggleStyle = (active) => ({
    borderColor: active ? "#B8860B" : "#D9CBB0",
    background: active ? "#F3E6C4" : "transparent",
    color: "#2B2620",
  });

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
      <div className="w-full max-w-sm bg-[#F6F1E7] rounded-2xl border border-[#D9CBB0] p-5 max-h-[85vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-serif text-lg text-[#2B2620]">나만의 여행운 보기</h2>
          <button onClick={onClose} aria-label="닫기" className="text-[#6B5F4F]"><X size={18} /></button>
        </div>
        <p className="text-xs text-[#6B5F4F] mb-4 leading-relaxed">
          입력하신 정보는 이 폰에만 저장되고 서버로 전송되지 않아요.
        </p>

        <div className="flex items-center justify-between mb-1">
          <label className="text-xs font-medium text-[#2B2620]">생년월일</label>
          <div className="flex gap-1">
            {[["solar", "양력"], ["lunar", "음력"]].map(([key, label]) => (
              <button
                key={key}
                onClick={() => changeCalendarType(key)}
                className="px-3 py-1 rounded-full text-xs border"
                style={toggleStyle(calendarType === key)}
              >
                {label}
              </button>
            ))}
          </div>
        </div>
        <div className="grid gap-1.5" style={{ gridTemplateColumns: "1.4fr 1fr 1fr" }}>
          <select aria-label="태어난 해" value={year} onChange={(e) => { setYear(e.target.value); setError(""); }} className={selectClass}>
            <option value="">년</option>
            {years.map((y) => <option key={y} value={y}>{y}년</option>)}
          </select>
          <select aria-label="태어난 달" value={month} onChange={(e) => { setMonth(e.target.value); setError(""); }} className={selectClass}>
            <option value="">월</option>
            {Array.from({ length: 12 }, (_, i) => String(i + 1)).map((m) => <option key={m} value={m}>{m}월</option>)}
          </select>
          <select aria-label="태어난 날" value={day} onChange={(e) => { setDay(e.target.value); setError(""); }} className={selectClass}>
            <option value="">일</option>
            {days.map((d) => <option key={d} value={d}>{d}일</option>)}
          </select>
        </div>
        {calendarType === "lunar" && (
          <label className="flex items-center gap-1.5 text-xs text-[#6B5F4F] mt-2">
            <input type="checkbox" checked={isLeapMonth} onChange={(e) => { setIsLeapMonth(e.target.checked); setError(""); }} />
            윤달(윤월)이에요
          </label>
        )}
        {error && <p className="text-[11px] text-[#A8441F] mt-2">{error}</p>}

        <label className="block text-xs font-medium text-[#2B2620] mt-4 mb-1">태어난 시간</label>
        <div className="grid grid-cols-4 gap-1.5">
          {BIRTH_HOUR_OPTIONS.map((o, i) => (
            <button
              key={o.label}
              onClick={() => setBranch(i)}
              className="py-1.5 rounded-lg border text-center"
              style={toggleStyle(branch === i)}
            >
              <span className="block text-sm font-bold">{o.label}시</span>
              <span className="block text-[10px] text-[#6B5F4F]">{o.range}</span>
            </button>
          ))}
        </div>
        <button
          onClick={() => setBranch(null)}
          className="w-full mt-1.5 py-1.5 rounded-lg border text-xs"
          style={toggleStyle(branch === null)}
        >
          시간을 몰라요 (시주 없이 계산)
        </button>

        <button
          onClick={handleSave}
          disabled={!complete}
          className="w-full mt-5 py-2.5 rounded-lg text-sm font-medium text-[#F6F1E7] bg-[#2B2620] disabled:opacity-50"
        >
          저장하고 보기
        </button>
      </div>
    </div>
  );
}

              onChange={(e) => {
                const file = e.target.files && e.target.files[0];
                if (file) onImportBackup(file);
                e.target.value = "";
              }}
            />
          </div>
          <p className="text-[11px] text-[#6B5F4F] mt-2 text-center">
            {backupNotice ||
              (lastBackupAt
                ? `마지막 백업: ${formatDate(lastBackupAt)}`
                : "기록은 이 폰에만 저장돼요. 앱을 지우거나 폰을 바꾸기 전에 백업해 두세요.")}
          </p>
        </div>
      </div>
    </div>
  );
}

// 다녀온 날짜를 고르는 창 - 새로 STAMP를 찍을 때와 이미 찍은 날짜를 고칠 때 같이 쓴다
function StampDateDialog({ spot, initialDate, title, confirmLabel, onConfirm, onCancel }) {
  const today = toDateInputValue();

  const valid = /^\d{4}-\d{2}-\d{2}$/.test(value) && value <= today;

  return (
    <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/40 px-4">
      <div className="w-full max-w-sm bg-[#F6F1E7] rounded-2xl border border-[#D9CBB0] p-5">

        <p className="text-sm text-[#6B5F4F] mt-1">{spot.name} · {spot.region}</p>

        <p className="text-xs font-medium text-[#2B2620] mt-4 mb-2">다녀온 날짜</p>

function StatusBlock({ status, error, emptyText }) {
  if (status === "loading") {
    return (
      <div className="flex items-center gap-2 text-sm text-[#6B5F4F] py-6 justify-center">
        <Loader2 size={16} className="animate-spin" /> 불러오는 중…
      </div>
    );
  }
  if (status === "error") {
    return (
      <div className="text-xs text-[#A8441F] bg-[#F5E4DA] border border-[#E3B79C] rounded-lg p-3 leading-relaxed">

    );

  if (status === "empty") {
    return <p className="text-sm text-[#6B5F4F] py-6 text-center">{emptyText}</p>;

}

// 축제 카드: 사진 · 진행 중/D-day 배지 · 기간

            className="font-bold rounded-full px-1.5 mr-1"

// 탭 구성. source = 관광정보에서 받아 올 종류(같은 source는 한 번만 받아 여러 탭이 나눠 쓴다),
// pick = 받아 온 목록에서 이 탭에 보여줄 것만 고르기
const TAB_CONFIG = {
  landmark: {
    label: "명소", icon: Compass, color: "#B8860B", emoji: "🏛️", source: "ct12",
    pick: (list) => list,
  },
  restaurant: {
    label: "맛집", icon: Utensils, color: "#C4592F", emoji: "🍽️", source: "ct39",
    pick: (list) => list.filter((p) => !p.cafe && !CHAIN_BRANDS.test(p.name)),
  },
  cafe: {
    label: "카페", icon: Coffee, color: "#8B5E3C", emoji: "☕", source: "ct39",
    // 사진 있는 곳을 앞으로 (각 그룹 안에서는 가까운 순 유지)
    pick: (list) => {
      const cafes = list.filter((p) => p.cafe && !CHAIN_BRANDS.test(p.name));
      return [...cafes.filter((p) => p.image), ...cafes.filter((p) => !p.image)];
    },
  },
  festival: { label: "축제", icon: PartyPopper, color: "#2F6E68", emoji: "🎉", source: "festival" },
  lodging: {
    label: "숙소", icon: Bed, color: "#6B4E9B", emoji: "🛏️", source: "ct32",
    // 모텔은 맨 뒤로
    pick: (list) => [...list.filter((p) => p.kind !== "모텔"), ...list.filter((p) => p.kind === "모텔")],
  },
  culture: {
    label: "문화", icon: Museum, color: "#2B4C7E", emoji: "🖼️", source: "ct14",
    pick: (list) => list,
  },
  // 반려동물 동반 가능 장소(명소·음식점·카페·숙소·레포츠·쇼핑)를 동반 조건과 함께
  pet: {
    label: "반려견", icon: Paw, color: "#9A5B2E", emoji: "🐶", source: "pet",
    pick: (list) => list,
  },
};

const SOURCE_FETCHERS = {
  ct12: (spot) => fetchNearbyTourSpots({ lat: spot.lat, lng: spot.lng, contentTypeId: 12, num: 30, preferImages: true }),
  ct39: (spot) => fetchNearbyTourSpots({ lat: spot.lat, lng: spot.lng, contentTypeId: 39, num: 30 }),
  ct32: (spot) => fetchNearbyTourSpots({ lat: spot.lat, lng: spot.lng, contentTypeId: 32, num: 30 }),
  ct14: (spot) => fetchNearbyTourSpots({ lat: spot.lat, lng: spot.lng, contentTypeId: 14, num: 30, preferImages: true }),
  festival: (spot) => fetchLocalFestivals({ regionKeyword: spot.name, lat: spot.lat, lng: spot.lng }),
  pet: (spot) => fetchPetNearby({ lat: spot.lat, lng: spot.lng }),
};

const PAGE_SIZE = 5;

function ResultDetailTabs({ spot, from, excludeIds = [], cache, setCache }) {
  const [tab, setTab] = useState("landmark");
  const [shown, setShown] = useState(PAGE_SIZE);
  const [retry, setRetry] = useState(0); // 실패한 탭을 다시 눌렀을 때 다시 불러오기
  const cfg = TAB_CONFIG[tab];
  const cacheKey = `${spot.id}:${cfg.source}`;
  const entry = cache[cacheKey];
  const foods = lookupRegion(REGION_FOODS, spot.name);
  // 일정표와 같은 기준으로 1박 2일 추천이면 숙소 탭에 표시
  const travel = planTravel(from, spot);
  const overnight = travel.mode === "island" || travel.travel >= OVERNIGHT_TRAVEL;

  // 불러오는 도중 다른 탭으로 바꿔도 결과는 그 source 칸(cacheKey)에 그대로 저장한다.
  // (도중에 취소하면 '불러오는 중'으로 영영 멈춘다 - 맛집·카페처럼 같은 source를 쓰는 탭이 있어서)
  // 실패했던 source는 탭을 다시 누르면 다시 시도한다.
  useEffect(() => {
    setShown(PAGE_SIZE);
    if (cache[cacheKey] && cache[cacheKey].status !== "error") return;
    setCache((prev) => ({ ...prev, [cacheKey]: { status: "loading" } }));
    SOURCE_FETCHERS[cfg.source](spot)
      .then((data) => {
        setCache((prev) => ({ ...prev, [cacheKey]: { status: "success", data } }));
      })
      .catch((err) => {
        const message = `${err.message}${err.code === "HTTP_ERROR" ? " 탭을 다시 누르면 다시 불러와요." : ""}`;
        setCache((prev) => ({ ...prev, [cacheKey]: { status: "error", message } }));
      });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tab, spot.id, retry]);

  // 명소·맛집·카페 탭에서는 이미 오늘 일정에 넣은 곳은 빼고 보여준다 (일정과 같은 곳이 반복되지 않게)
  const picked = entry && entry.status === "success" ? (cfg.pick ? cfg.pick(entry.data) : entry.data) : [];
  const hidesPlanPlaces = tab === "landmark" || tab === "restaurant" || tab === "cafe";
  const items = hidesPlanPlaces ? picked.filter((p) => !excludeIds.includes(p.id)) : picked;
  const hiddenCount = picked.length - items.length;

  return (
    <div className="mt-4">
      <div className="flex gap-1 bg-white/40 rounded-lg p-1 overflow-x-auto">
        {Object.entries(TAB_CONFIG).map(([key, t]) => {
          const Icon = t.icon;
          const active = tab === key;
          // minWidth: 0 → 탭 7개가 한 줄 너비를 똑같이 나눠 쓴다 (최소 너비가 있으면 폰에서 마지막 탭이 잘림)
          return (
            <button
              key={key}
              onClick={() => {
                if (key === tab && entry && entry.status === "error") setRetry((n) => n + 1);
                setTab(key);
              }}
              className="relative flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-md text-[10px] font-medium min-w-[44px]"
              style={{ background: active ? t.color : "transparent", color: active ? "#F6F1E7" : "#6B5F4F", minWidth: 0 }}
            >
              <Icon size={13} />
              {t.label}
              {key === "lodging" && overnight && (
                <span className="absolute -top-1 right-1 text-[9px] font-bold rounded-full px-1" style={{ background: "#C4592F", color: "#F6F1E7" }}>1박</span>
              )}
            </button>
          );
        })}
      </div>

      <div className="mt-3 space-y-2">
        {tab === "restaurant" && foods && (
          <a
            href={`https://map.kakao.com/?q=${encodeURIComponent(`${spot.name} ${foods[0]}`)}`}
            target="_blank"
            rel="noreferrer"
            className="block text-sm font-bold text-[#2B2620] border border-[#B8860B] rounded-lg px-3 py-2.5"
            style={{ background: "#FFF4D6" }}
          >
            🍜 {spot.name} 별미 「{foods.join(" · ")}」 맛집 찾기 ↗
          </a>
        )}
        {tab === "pet" && entry && entry.status === "success" && (
          <p className="text-[11px] text-[#6B5F4F] bg-white/40 border border-dashed border-[#D9CBB0] rounded-lg px-3 py-2">
            🐶 여행지 주변 20km 안에서 반려동물과 함께 갈 수 있는 곳이에요{items.length > 0 ? ` (${items.length}곳)` : ""}.
            {items.length > 0 && items.length < 5 && " 이 지역은 반려동물 동반 정보가 많지 않아요."}
            {" "}동반 조건은 바뀔 수 있으니 방문 전에 꼭 확인하세요.
          </p>
        )}
        {tab === "lodging" && overnight && (
          <p className="text-xs text-[#6B5F4F] bg-white/40 border border-dashed border-[#D9CBB0] rounded-lg px-3 py-2">
            🛏️ 오늘 일정은 1박 2일을 추천해요. 묵을 곳을 미리 확인해 보세요.
          </p>
        )}

        {hidesPlanPlaces && hiddenCount > 0 && (
          <p className="text-[11px] text-[#6B5F4F]">📅 오늘 일정에 넣은 {hiddenCount}곳은 위 일정표에 있어서 빼고 보여줘요.</p>
        )}
        {!entry || entry.status === "loading" ? (
          <StatusBlock status="loading" />
        ) : entry.status === "error" ? (
          <StatusBlock status="error" error={entry.message} />
        ) : items.length === 0 ? (
          tab === "cafe" ? (
            <MapLinkList links={buildMapSearchLinks(spot, "카페")} />
          ) : (
            <StatusBlock status="empty" emptyText={tab === "festival" ? "가까운 곳에 열리는 축제가 없어요." : tab === "pet" ? "이 지역은 반려동물 동반 정보가 아직 없어요." : "검색된 정보가 없어요."} />
          )
        ) : (
          <>
            {items.slice(0, shown).map((p) =>
              tab === "festival" ? <FestivalCard key={p.id} festival={p} /> : <PlaceCard key={p.id} place={p} emoji={cfg.emoji} />
            )}
            {items.length > shown && (
              <button
                onClick={() => setShown((n) => n + PAGE_SIZE)}
                className="w-full py-2 rounded-lg text-xs font-bold text-[#6B5F4F] border border-[#D9CBB0]"
              >
                더 보기 ({items.length - shown}곳 더)
              </button>
            )}
          </>
        )}

        {tab === "culture" && (
          <div className="pt-1">
            <p className="text-[11px] text-[#6B5F4F] mb-1">📚 동네 서점 찾기</p>
            <MapLinkList links={buildMapSearchLinks(spot, "서점")} />
          </div>
        )}
      </div>
    </div>
  );
}

// ==========================================
// 7. 메인 화면
// ==========================================
// API 키처럼 새로고침해도 유지됐으면 하는 값을 localStorage와 동기화하는 훅.
// localStorage를 쓸 수 없는 환경(일부 미리보기 iframe, 프라이빗 모드 등)에서는
// 조용히 실패하고 평범한 메모리 state로만 동작한다 (에러로 앱이 죽지 않음).
function usePersistentState(key, initialValue) {
  const [value, setValue] = useState(() => {
    try {
      const saved = window.localStorage.getItem(key);
      return saved !== null ? saved : initialValue;
    } catch {
      return initialValue;
    }
  });

  useEffect(() => {
    try {
      window.localStorage.setItem(key, value);
    } catch {
      // 저장 불가 환경 - 무시하고 메모리 state만 유지
    }
  }, [key, value]);

  return [value, setValue];
}

function BaramApp() {
  const [spots, setSpots] = useState(() => buildSpots());
  const [region, setRegion] = useState("전체");
  const [currentLocation, setCurrentLocation] = useState(() => LOCATIONS.find((l) => l.name === "하남시"));
  const [rouletteSpots, setRouletteSpots] = useState([]);
  const [result, setResult] = useState(null);
  const [phase, setPhase] = useState("idle"); // idle | ramping | spinning | stopping
  const [locationDialogOpen, setLocationDialogOpen] = useState(false);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [detailCache, setDetailCache] = useState({});
  // 오늘 일정에 들어간 장소 id. 쉼표로 이은 문자열로 들고 있어서 내용이 같으면 상태가 바뀌지 않는다
  // (배열로 들면 같은 내용이어도 매번 새 값이 돼 화면을 계속 다시 그리게 된다)
  const [planPlaceIdsKey, setPlanPlaceIdsKey] = useState("");
  const planPlaceIds = useMemo(() => (planPlaceIdsKey ? planPlaceIdsKey.split(",") : []), [planPlaceIdsKey]);
  const [stampSpotId, setStampSpotId] = useState(null);
  const [confirmState, setConfirmState] = useState(null); // { title, message, confirmLabel, onConfirm }
  const [stampDateTarget, setStampDateTarget] = useState(null); // { spotId, mode: "stamp" | "edit" }
  const [lastBackupAt, setLastBackupAt] = usePersistentState(LAST_BACKUP_KEY, "");
  const [backupNotice, setBackupNotice] = useState("");
  const [birthInfoRaw, setBirthInfoRaw] = usePersistentState("baram_birthInfo", "");
  const [birthModalOpen, setBirthModalOpen] = useState(false);

  const birthInfo = useMemo(() => {
    try {
      return birthInfoRaw ? JSON.parse(birthInfoRaw) : null;
    } catch {
      return null;
    }
  }, [birthInfoRaw]);
  const saju = useMemo(() => (birthInfo ? computeSaju(birthInfo) : null), [birthInfo]);
  const travelFortune = useMemo(() => (saju ? getTravelFortune(saju) : null), [saju]);

  function saveBirthInfo(info) {
    setBirthInfoRaw(JSON.stringify(info));
    setBirthModalOpen(false);
  }

  const wheelRef = useRef(null);
  const angleRef = useRef(0);
  const rafRef = useRef(null);

  // 스크롤을 내리면 머리 부분 아래에 그림자를 보여준다 (높이는 바꾸지 않음)
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 8);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const rampTimeoutRef = useRef(null);

  const visitedCount = spots.filter((s) => s.isVisited).length;
  // 감성/활기를 더 이상 따로 고르지 않으므로, 뽑힌 결과의 테마에 맞춰 강조색이 바뀐다
  const accent = result ? (result.mood === "emotional" ? "#1B4B91" : "#B3261E") : "#2B2620";

  // 감성 여행 + 활기찬 여행을 하나로 합쳐, 두 테마가 최대한 번갈아 나오도록 ROULETTE_SIZE곳을 뽑는다
  function pickRouletteSpots(currentSpots, currentRegion, currentLoc) {
    const candidates = currentSpots.filter((s) => {
      if (s.isVisited) return false;
      if (s.name === currentLoc.name) return false;
      if (currentRegion !== "전체" && s.region !== currentRegion) return false;
      return true;
    });
    const emotional = shuffle(candidates.filter((s) => s.mood === "emotional"));
    const energetic = shuffle(candidates.filter((s) => s.mood === "energetic"));

    // 감성/활기 두 목록을 하나씩 번갈아 채워서 사이사이에 섞이도록 구성
    const interleaved = [];
    let ei = 0, gi = 0;
    let turnEmotional = true;
    while (interleaved.length < ROULETTE_SIZE && (ei < emotional.length || gi < energetic.length)) {
      if (turnEmotional && ei < emotional.length) {
        interleaved.push(emotional[ei++]);
      } else if (!turnEmotional && gi < energetic.length) {
        interleaved.push(energetic[gi++]);
      } else if (ei < emotional.length) {
        interleaved.push(emotional[ei++]);
      } else if (gi < energetic.length) {
        interleaved.push(energetic[gi++]);
      }
      turnEmotional = !turnEmotional;
    }

    // 룰렛판만 새로 만든다. 이미 정해진 여행지(result)는 여기서 지우지 않는다 -
    // 권역/내 위치를 바꾸거나 앱을 다시 켜도 가던 여행지가 사라지면 안 되기 때문.
    setRouletteSpots(interleaved);
    angleRef.current = 0;
    if (wheelRef.current) wheelRef.current.style.transform = "rotate(0deg)";
  }

  // 폰 저장 공간이 부족할 때 브라우저가 도장깨기 기록(IndexedDB)을 자동으로 지우지 않도록 요청한다.
  // (사용자가 직접 앱 데이터를 지우는 경우는 막을 수 없어서 백업 기능이 따로 있다)
  useEffect(() => {
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted()
          .then((already) => (already ? true : navigator.storage.persist()))
          .catch(() => {});
      }
    } catch {
      // 지원하지 않는 환경 - 무시
    }
  }, []);

  // 앱이 처음 열릴 때 IndexedDB에 저장된 도장깨기 진행 기록을 불러와 병합한 뒤 룰렛을 뽑는다.
  // (IndexedDB는 비동기라 useState 초기값으로는 못 쓰고, 마운트 후 이렇게 불러와야 한다)
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const progress = await loadSpotsProgress();
      if (cancelled) return;
      const merged = mergeSpotsWithProgress(spots, progress);
      setSpots(merged);
      // 지난번에 앱을 닫기 전 마지막으로 나왔던 "현재 위치"와 "룰렛 결과"를 복원한 뒤 룰렛판을 만든다.
      let loc = currentLocation;
      try {
        const savedLocName = window.localStorage.getItem(CURRENT_LOCATION_KEY);
        const savedLoc = savedLocName ? LOCATIONS.find((l) => l.name === savedLocName) : null;
        if (savedLoc) {
          loc = savedLoc;
          setCurrentLocation(savedLoc);
        }

        const savedResultId = window.localStorage.getItem(CURRENT_RESULT_KEY);
        if (savedResultId) {
          const savedSpot = merged.find((s) => s.id === savedResultId);
          if (savedSpot && !savedSpot.isVisited) setResult(savedSpot);
        }
      } catch {
        // localStorage를 쓸 수 없는 환경 - 그냥 처음 상태로 시작
      }
      pickRouletteSpots(merged, region, loc);
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function changeRegion(next) {
    if (phase !== "idle") return;
    setRegion(next);
    pickRouletteSpots(spots, next, currentLocation);
  }

  function selectLocation(loc) {
    setCurrentLocation(loc);
    try { window.localStorage.setItem(CURRENT_LOCATION_KEY, loc.name); } catch {}
    setLocationDialogOpen(false);
    pickRouletteSpots(spots, region, loc);
  }

  function conquerSpot(id, visitedDate = new Date().toISOString()) {
    // 지금 가기로 한 여행지에 도장을 찍었으면 여행이 끝난 것이므로 결과를 비운다
    if (result && result.id === id) clearResult();
    setSpots((prev) => {
      const next = prev.map((s) => (s.id === id ? { ...s, isVisited: true, visitedDate } : s));
      const updated = next.find((s) => s.id === id);
      if (updated) saveSpotProgress(updated);
      pickRouletteSpots(next, region, currentLocation);
      return next;
    });
  }

  function unvisitSpot(id) {
    setSpots((prev) => {
      const next = prev.map((s) => (s.id === id ? { ...s, isVisited: false, visitedDate: null } : s));
      const updated = next.find((s) => s.id === id);
      if (updated) saveSpotProgress(updated);
      pickRouletteSpots(next, region, currentLocation);
      return next;
    });
  }

  function exportBackup() {
    const backup = buildBackup(spots);
    if (backup.spots.length === 0) {
      setBackupNotice("아직 백업할 기록이 없어요.");
      return;
    }
    downloadJson(`BARAM-백업-${toDateInputValue()}.json`, backup);
    setLastBackupAt(backup.exportedAt);
    setBackupNotice(`STAMP ${backup.spots.filter((s) => s.isVisited).length}곳을 백업 파일로 저장했어요. (다운로드 폴더)`);
  }

  function importBackup(file) {
    file.text().then((text) => {
      let parsed;
      try {
        parsed = parseBackup(text, spots);
      } catch (err) {
        setBackupNotice(err.message);
        return;
      }
      const stampCount = parsed.records.filter((r) => r.isVisited).length;
      setConfirmState({
        title: "백업을 불러올까요?",
        message: `${formatDate(parsed.exportedAt)}에 만든 백업이에요 (STAMP ${stampCount}곳).\n지금 이 폰의 기록은 백업 내용으로 바뀌어요.`,
        confirmLabel: "불러오기",
        onConfirm: async () => {
          try {
            await replaceAllSpotsProgress(parsed.records);
          } catch {
            setBackupNotice("백업을 불러오지 못했어요. 다시 시도해 주세요.");
            return;
          }
          const progress = {};
          parsed.records.forEach((r) => { progress[r.id] = r; });
          const base = spots.map((s) => ({ ...s, isVisited: false, visitedDate: null, photos: [null, null], memo: "" }));
          const merged = mergeSpotsWithProgress(base, progress);
          setSpots(merged);
          if (result && merged.find((s) => s.id === result.id && s.isVisited)) clearResult();
          pickRouletteSpots(merged, region, currentLocation);
          setBackupNotice(`백업을 불러왔어요. STAMP ${stampCount}곳`);
        },
      });
    });
  }

  function updateSpotDate(id, visitedDate) {
    setSpots((prev) => {
      const next = prev.map((s) => (s.id === id ? { ...s, visitedDate } : s));
      const updated = next.find((s) => s.id === id);
      if (updated) saveSpotProgress(updated);
      return next;
    });
  }

  // 도장깨기: 여행지에 남기는 추억(사진 2컷 + 메모)
  function updateSpotMemo(id, text) {
    setSpots((prev) => {
      const next = prev.map((s) => (s.id === id ? { ...s, memo: text } : s));
      const updated = next.find((s) => s.id === id);
      if (updated) saveSpotProgress(updated);
      return next;
    });
  }

  // 원본 사진을 그대로 base64로 저장하면 장당 수 MB씩 쌓여 브라우저 메모리를 많이 차지한다.
  // 캔버스에 그려서 가로 최대 900px, JPEG 품질 0.75로 줄인 뒤 저장한다 (보통 장당 100~200KB 수준).
  function compressImage(file, maxWidth = 900, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        reject(new Error("이미지를 불러올 수 없어요."));
      };
      img.src = objectUrl;
    });
  }

  function updateSpotPhoto(id, slotIndex, file) {
    compressImage(file)
      .then((dataUrl) => {
        setSpots((prev) => {
          const next = prev.map((s) => {
            if (s.id !== id) return s;
            const photos = s.photos && s.photos.length === 2 ? [...s.photos] : [null, null];
            photos[slotIndex] = dataUrl;
            return { ...s, photos };
          });
          const updated = next.find((s) => s.id === id);
          if (updated) saveSpotProgress(updated);
          return next;
        });
      })
      .catch(() => {
        // 압축 실패(지원 안 되는 파일 등) 시 조용히 무시 - 사진 슬롯은 비어있는 채로 유지
      });
  }

  function removeSpotPhoto(id, slotIndex) {
    setSpots((prev) => {
      const next = prev.map((s) => {
        if (s.id !== id) return s;
        const photos = s.photos && s.photos.length === 2 ? [...s.photos] : [null, null];
        photos[slotIndex] = null;
        return { ...s, photos };
      });
      const updated = next.find((s) => s.id === id);
      if (updated) saveSpotProgress(updated);
      return next;
    });
  }

  function clearResult() {
    setResult(null);
    try { window.localStorage.removeItem(CURRENT_RESULT_KEY); } catch {}
  }

  // 이미 가기로 한 여행지가 있으면 실수로 눌러 날아가지 않도록 한 번 물어본다
  function startSpin() {
    if (rouletteSpots.length === 0 || phase !== "idle") return;
    if (result) {
      setConfirmState({
        title: "룰렛을 다시 돌릴까요?",
        message: `지금 여행지(${result.name})는 사라지고 새 여행지를 뽑아요.`,
        confirmLabel: "다시 돌리기",
        onConfirm: spinNow,
      });
      return;
    }
    spinNow();
  }

  function spinNow() {
    clearResult();
    setPhase("ramping");
    const el = wheelRef.current;
    const rampTarget = angleRef.current + 720;
    el.style.transition = "transform 0.6s cubic-bezier(0.55,0,1,0.45)";
    el.style.transform = `rotate(${rampTarget}deg)`;
    angleRef.current = rampTarget;
    rampTimeoutRef.current = setTimeout(() => {
      el.style.transition = "none";
      setPhase("spinning");
      let last = performance.now();
      function loop(now) {
        const dt = now - last;
        last = now;
        angleRef.current += dt * 0.55;
        el.style.transform = `rotate(${angleRef.current}deg)`;
        rafRef.current = requestAnimationFrame(loop);
      }
      rafRef.current = requestAnimationFrame(loop);
    }, 620);
  }

  function stopSpin() {
    if (phase === "idle" || phase === "stopping" || rouletteSpots.length === 0) return;
    cancelAnimationFrame(rafRef.current);
    clearTimeout(rampTimeoutRef.current);
    setPhase("stopping");

    const n = rouletteSpots.length;
    const selectedIndex = Math.floor(Math.random() * n);
    const sectionAngle = 360 / n;
    const targetSectorAngle = 360 - selectedIndex * sectionAngle - sectionAngle / 2;
    const current = angleRef.current % 360;
    const finalAngle = angleRef.current + (1080 + targetSectorAngle - current);

    const el = wheelRef.current;
    el.style.transition = "transform 3s cubic-bezier(0.16,1,0.3,1)";
    el.style.transform = `rotate(${finalAngle}deg)`;
    angleRef.current = finalAngle;

    setTimeout(() => {
      setPhase("idle");
      const chosen = rouletteSpots[selectedIndex];
      setResult(chosen);
      try { window.localStorage.setItem(CURRENT_RESULT_KEY, chosen.id); } catch {}
    }, 3050);
  }

  function handleWheelTap() {
    if (phase === "idle") startSpin();
    else if (phase !== "stopping") stopSpin();
  }

  useEffect(() => () => {
    cancelAnimationFrame(rafRef.current);
    clearTimeout(rampTimeoutRef.current);
  }, []);

  // 룰렛 결과(지역)가 정해지면 그 지역의 명소·맛집을 공공데이터(TourAPI, 서버 프록시)로 불러와 하루 일정표를 구성한다
  const itineraryKey = result ? `${result.id}:itinerary` : null;
  // 일정표 장소 불러오기. 결과는 itineraryKey 칸에 저장하므로 도중에 취소하지 않는다(취소하면 '불러오는 중'에서 멈춤).
  // 명소·맛집 중 하나만 성공해도 그만큼은 보여주고, 둘 다 실패하면 '다시 불러오기'로 재시도할 수 있다.
  const [itineraryRetry, setItineraryRetry] = useState(0);
  useEffect(() => {
    if (!result || !itineraryKey) return;
    const prevEntry = detailCache[itineraryKey];
    // 이미 다 받아 온 일정은 다시 받지 않는다. 실패했거나 일부만 받은 경우는 '다시 불러오기'로 재시도
    if (prevEntry && prevEntry.status !== "error" && !prevEntry.partial) return;
    // 일부만 받은 상태에서 다시 불러올 때는 보이던 장소를 지우지 않고 그대로 둔 채 받는다
    if (!prevEntry || prevEntry.status === "error") {
      setDetailCache((prev) => ({ ...prev, [itineraryKey]: { status: "loading" } }));
    } else {
      setDetailCache((prev) => ({ ...prev, [itineraryKey]: { ...prevEntry, retrying: true } }));
    }
    const prevData = prevEntry && prevEntry.data ? prevEntry.data : {};

    (async () => {
      // 명소·맛집은 '다른 곳 보기'로 바꿔 볼 수 있게 후보를 넉넉히 받는다. 축제는 실패해도 일정은 보여준다.
      const [landmarks, restaurants, festivals] = await Promise.allSettled([
        fetchNearbyTourSpots({ lat: result.lat, lng: result.lng, contentTypeId: 12, num: 8, preferImages: true }),
        fetchNearbyTourSpots({ lat: result.lat, lng: result.lng, contentTypeId: 39, num: 30 }),
        fetchLocalFestivals({ regionKeyword: result.name, lat: result.lat, lng: result.lng }),
      ]);
      // 이번에 실패한 것은 지난번에 받아 둔 것(있으면)을 그대로 쓴다
      const value = (r, name) => (r.status === "fulfilled" ? r.value : prevData[name] || []);
      const hasLandmarks = landmarks.status === "fulfilled" || (prevData.landmarks || []).length > 0;
      const hasRestaurants = restaurants.status === "fulfilled" || (prevData.restaurants || []).length > 0;
      if (!hasLandmarks && !hasRestaurants) {
        setDetailCache((prev) => ({ ...prev, [itineraryKey]: { status: "error", message: landmarks.reason?.message || "장소 정보를 불러오지 못했어요." } }));
        return;
      }
      setDetailCache((prev) => ({
        ...prev,
        [itineraryKey]: {
          status: "success",
          partial: !hasLandmarks || !hasRestaurants,
          data: { landmarks: value(landmarks, "landmarks"), restaurants: value(restaurants, "restaurants"), festivals: value(festivals, "festivals") },
        },
      }));
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [result?.id, itineraryRetry]);
  const retryItinerary = () => setItineraryRetry((n) => n + 1);
  const itineraryEntry = itineraryKey ? detailCache[itineraryKey] : null;

  // 반려동물 동반 정보: 여행지가 정해지면 미리 받아 둔다. '더 알아보기'의 반려동물 탭과 같은 칸(:pet)을 같이 쓰고,
  // 일정표에서는 동반 가능한 장소에 배지를 붙이는 데 쓴다. 실패해도 일정표는 그대로 보여준다.
  const petKey = result ? `${result.id}:pet` : null;
  useEffect(() => {
    if (!result || !petKey) return;
    if (detailCache[petKey] && detailCache[petKey].status !== "error") return;
    setDetailCache((prev) => ({ ...prev, [petKey]: { status: "loading" } }));
    fetchPetNearby({ lat: result.lat, lng: result.lng })
      .then((data) => setDetailCache((prev) => ({ ...prev, [petKey]: { status: "success", data } })))
      .catch((err) => setDetailCache((prev) => ({ ...prev, [petKey]: { status: "error", message: err.message } })));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [result?.id]);
  const petEntry = petKey ? detailCache[petKey] : null;
  const petById = useMemo(() => {
    const map = new Map();
    if (petEntry && petEntry.status === "success") petEntry.data.forEach((p) => map.set(String(p.id), p.pet));
    return map;
  }, [petEntry]);
  // 결과가 바뀔 때만 새로 뽑히도록 useMemo로 고정 (탭 전환 등 다른 리렌더에는 곡이 안 바뀜)
  const songKey = result ? `${result.id}:${toDateInputValue()}` : "";
  const gayoSongs = useMemo(() => (result ? pickSongsForTrip(GAYO_SONGS, result.mood, 1, `${songKey}:gayo`) : []), [songKey]);
  const popSongs = useMemo(() => (result ? pickSongsForTrip(POP_SONGS, result.mood, 1, `${songKey}:pop`) : []), [songKey]);
  const regionSong = useMemo(() => {
    const list = result ? lookupRegion(REGION_SONGS, result.name) : null;
    return list ? list[hashString(`${songKey}:region`) % list.length] : null;
  }, [songKey]);
  const regionFoods = result ? lookupRegion(REGION_FOODS, result.name) : null;

  const route = result ? distanceEta(currentLocation.lat, currentLocation.lng, result.lat, result.lng) : null;
  const disabled = phase !== "idle";

  return (
    <div className="min-h-screen bg-[#F6F1E7] flex flex-col items-center">
      {/* 머리 부분: 화면 맨 위에 고정. 스크롤을 내리면 얇아지고 아래에 구분선이 생긴다 */}
      {/* 머리 부분은 스크롤해도 높이가 변하지 않게 한다. 예전에 내리면 얇아지게 했더니, 높이 변화 →
          스크롤 위치 보정 → 다시 높이 변화가 반복되며 일부 안드로이드 폰에서 화면이 아래로 반복돼
          그려지는 문제가 생겼다. 스크롤하면 그림자만 생긴다. 자체 레이어(translateZ)로 따로 그린다. */}
      <header
        className="w-full"
        style={{
          position: "sticky",
          top: 0,
          zIndex: 40,
          background: "#F6F1E7",
          paddingTop: "env(safe-area-inset-top)",
          borderBottom: `1px solid ${scrolled ? "#D9CBB0" : "transparent"}`,
          boxShadow: scrolled ? "0 2px 8px rgba(43,38,32,.08)" : "none",
          transform: "translateZ(0)",
        }}
      >
        <div className="max-w-sm mx-auto flex items-center justify-between" style={{ padding: "10px 16px" }}>
          <div className="flex items-center gap-3">
            <MiniRoulette size={40} fast={phase !== "idle"} />
            <div>
              <p className="text-xs tracking-wide font-bold text-[#1B4B91]">여행 룰렛</p>
              <h1 className="font-serif font-bold text-[#DC2626]" style={{ fontSize: 22, lineHeight: 1.15 }}>
                BARAM
              </h1>
            </div>
          </div>
          <button
            onClick={() => setDrawerOpen(true)}
            className="relative flex flex-col items-center rounded-xl border border-[#B8860B] text-[#B8860B]"
            style={{ background: "#FFF4D6", padding: "5px 10px", gap: 1 }}
            aria-label="STAMP TOUR 열기"
          >
            <StampIcon size={18} />
            <span className="text-[10px] font-bold text-[#2B2620]" style={{ letterSpacing: ".06em" }}>STAMP</span>
            {visitedCount > 0 && (
              <span className="absolute -top-1.5 -right-1.5 bg-[#C4592F] text-[#F6F1E7] text-[10px] font-medium rounded-full px-1.5 py-0.5 min-w-[18px] text-center">
                {visitedCount}
              </span>
            )}
          </button>
        </div>
      </header>

      <div className="w-full max-w-sm" style={{ padding: "12px 16px 32px" }}>

        {/* 내 위치 */}
        <button
          onClick={() => setLocationDialogOpen(true)}
          className="w-full flex items-center gap-2 bg-white/50 border border-[#D9CBB0] rounded-xl px-4 py-3 text-left"
        >
          <MapPin size={16} style={{ color: accent }} />
          <span className="flex-1 text-sm font-medium text-[#2B2620]">내 위치: {currentLocation.name}</span>
          <Search size={14} className="text-[#A6987F]" />
        </button>

        {/* 오늘의 여행운 (재미 코너) */}
        {travelFortune ? (
          <TravelFortuneCard fortune={travelFortune} onEdit={() => setBirthModalOpen(true)} />
        ) : (
          <button
            onClick={() => setBirthModalOpen(true)}
            className="w-full mt-4 flex items-center justify-center gap-1.5 border border-dashed border-[#D9CBB0] rounded-xl px-4 py-2.5 text-xs text-[#6B5F4F]"
          >
            ✦ 생년월일을 입력하고 나만의 여행운 보기
          </button>
        )}

        {/* 감성+활기 통합 배너 (더 이상 따로 고르지 않음) */}
        <div
          className="mt-4 rounded-xl px-4 py-3 text-center"
          style={{ background: "linear-gradient(90deg, #DCE7F5 0%, #F3E9DC 50%, #F8DCDC 100%)", border: "1px solid #D9CBB0" }}
        >
          <p className="text-sm font-extrabold" style={{ background: "linear-gradient(90deg, #1B4B91, #B3261E)", WebkitBackgroundClip: "text", backgroundClip: "text", color: "transparent" }}>
            몰라!! 돌려서 나오는 데로 갈꺼야! ({spots.length}개 지역)
          </p>
          <p className="text-xs font-medium text-[#6B5F4F] mt-1 text-center">
            <Moon size={14} className="inline-block align-middle -mt-0.5" /> 감성 여행 + <Zap size={14} className="inline-block align-middle -mt-0.5" /> 활기찬 여행이 빚어내는 마법 속으로...
          </p>
        </div>

        {/* 지역 필터 (1줄: 전체·서울·경기·인천·제주 / 2줄: 강원·충청·영남·호남) - 지역마다 고유 색상 */}
        <div className="mt-4 space-y-2">
          <div className="flex gap-2 justify-center">
            {REGION_LIST.slice(0, 4).map((r) => {
              const c = REGION_COLORS[r];
              const active = region === r;
              return (
                <button
                  key={r}
                  disabled={disabled}
                  onClick={() => changeRegion(r)}
                  className="flex-1 text-xs px-2 py-1.5 rounded-full border font-bold disabled:opacity-60 whitespace-nowrap"
                  style={{
                    borderColor: c,
                    background: active ? c : `${c}1F`,
                    color: active ? "#F6F1E7" : c,
                  }}
                >
                  {r}
                </button>
              );
            })}
          </div>
          <div className="flex gap-2 justify-center">
            {REGION_LIST.slice(4).map((r) => {
              const c = REGION_COLORS[r];
              const active = region === r;
              return (
                <button
                  key={r}
                  disabled={disabled}
                  onClick={() => changeRegion(r)}
                  className="flex-1 text-xs px-2 py-1.5 rounded-full border font-bold disabled:opacity-60"
                  style={{
                    borderColor: c,
                    background: active ? c : `${c}1F`,
                    color: active ? "#F6F1E7" : c,
                  }}
                >
                  {r}
                </button>
              );
            })}
          </div>
        </div>

        {/* 룰렛 */}
        <div className="relative mx-auto mt-8" style={{ width: 280, height: 280 }}>
          {rouletteSpots.length > 0 ? (
            <RouletteWheel spots={rouletteSpots} wheelRef={wheelRef} />
          ) : (
            <div className="w-full h-full flex items-center justify-center text-center text-sm text-[#6B5F4F] whitespace-pre-line">
              {"해당 조건의 미정복 도시를\n모두 탐험하셨습니다!"}
            </div>
          )}

          {/* 포인터: 지도 핀(물방울) 모양 - 빨간색, 아래쪽 뾰족한 부분을 더 길게 */}
          <svg width="26" height="40" viewBox="0 0 26 40" className="absolute -top-3 left-1/2 -translate-x-1/2 drop-shadow-md">
            <path d="M3 13 L13 38 L23 13 Z" fill="#DC2626" stroke="#2B2620" strokeWidth="1.2" strokeLinejoin="round" />
            <circle cx="13" cy="12" r="10" fill="#DC2626" stroke="#2B2620" strokeWidth="1.2" />
            <circle cx="13" cy="12" r="4" fill="#F6F1E7" />
          </svg>

          <button
            onClick={handleWheelTap}
            disabled={rouletteSpots.length === 0}
            className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full border-4 border-[#F6F1E7] flex items-center justify-center text-sm font-bold text-white disabled:opacity-50"
            style={{ background: phase === "spinning" || phase === "ramping" ? "#A8441F" : accent }}
          >
            {phase === "stopping" ? "어디?" : phase === "idle" ? "START" : "STOP"}
          </button>
        </div>
        <p className="text-center text-[11px] text-[#A6987F] mt-2">
          내 위치({currentLocation.name}) 제외 · 후보 {rouletteSpots.length}곳
        </p>

        {/* 결과 카드 */}
        {result && route && (
          <div className="mt-6 bg-white/60 border border-dashed border-[#B8860B] rounded-xl p-5">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2 min-w-0">
                <span className="text-[10px] tracking-wide px-2 py-0.5 rounded-full shrink-0" style={{ background: result.mood === "emotional" ? "#DCE7F5" : "#F8DCDC", color: accent }}>
                  {result.region}
                </span>
                <h3
                  className="font-serif text-base font-bold truncate"
                  style={{ color: result.mood === "emotional" ? "#0F2D5C" : "#A61B1B" }}
                >
                  {result.name}
                </h3>
              </div>
              <span
                className="text-[10px] font-bold flex items-center gap-1 shrink-0"
                style={{ color: result.mood === "emotional" ? "#0F2D5C" : "#A61B1B" }}
              >
                {result.mood === "emotional" ? <Moon size={11} /> : <Zap size={11} />}
                {result.mood === "emotional" ? "감성 코스" : "활기 코스"}
              </span>
            </div>
            <p className="text-sm text-[#6B5F4F] mt-1">{result.description}</p>
            {regionFoods && (
              <p className="inline-block mt-2 text-xs font-bold text-[#2B2620] border border-[#B8860B] rounded-full px-2.5 py-1" style={{ background: "#FFF4D6" }}>
                🍜 {result.name} 별미: {regionFoods.join(" · ")}
              </p>
            )}

            <div className="border-t border-[#D9CBB0] my-3" />
            {needsFerryOrFlight(currentLocation.name, result.name) ? (
              <div className="text-sm font-medium text-[#2B2620]">
                ⛴️✈️ 배나 비행기로 가야 하는 곳이에요
                <p className="text-xs font-normal text-[#6B5F4F] mt-0.5">
                  {currentLocation.name}에서 직선거리 약 {Math.round(haversineKm(currentLocation.lat, currentLocation.lng, result.lat, result.lng))}km · 배편/항공편을 먼저 확인하세요.
                </p>
              </div>
            ) : (
              <div className="flex items-center gap-1.5 text-sm font-medium text-[#2B2620]">
                <Car size={14} /> 예상 소요: {route.duration} ({route.distance})
              </div>
            )}
            <div className="grid grid-cols-2 gap-2 mt-3">
              <a
                href={`https://map.kakao.com/link/to/${encodeURIComponent(result.name)},${result.lat},${result.lng}`}
                target="_blank" rel="noreferrer"
                className="flex items-center justify-center gap-1 bg-white/50 border border-[#D9CBB0] rounded-lg px-2 py-2 text-xs font-bold text-[#2B2620]"
              >
                카카오맵 길찾기 <ExternalLink size={12} className="text-[#2F6E68]" />
              </a>
              <a
                href={`https://map.naver.com/p/search/${encodeURIComponent(result.name)}`}
                target="_blank" rel="noreferrer"
                className="flex items-center justify-center gap-1 bg-white/50 border border-[#D9CBB0] rounded-lg px-2 py-2 text-xs font-bold text-[#2B2620]"
              >
                네이버 지도 <ExternalLink size={12} className="text-[#2F6E68]" />
              </a>
            </div>

            <DayItinerary key={`${result.id}:plan`} spot={result} from={currentLocation} entry={itineraryEntry} gayoSongs={gayoSongs} popSongs={popSongs} regionSong={regionSong} onPlanPlaces={setPlanPlaceIdsKey} onRetry={retryItinerary} petById={petById} />

            <div className="border-t border-[#D9CBB0] my-4" />
            <p className="text-xs font-medium text-[#2B2620] mb-1">더 알아보기</p>
            <ResultDetailTabs
              key={`${result.id}:tabs`}
              spot={result}
              from={currentLocation}
              excludeIds={planPlaceIds}
              cache={detailCache}
              setCache={setDetailCache}
            />

            <button
              onClick={() => setStampDateTarget({ spotId: result.id, mode: "stamp" })}
              className="w-full mt-4 py-2.5 rounded-lg text-lg font-extrabold tracking-[0.3em] text-[#F6F1E7]"
              style={{ background: accent }}
            >
              STAMP
            </button>
          </div>
        )}
      </div>

      {locationDialogOpen && (
        <LocationDialog
          currentLocation={currentLocation}
          onSelect={selectLocation}
          onClose={() => setLocationDialogOpen(false)}
        />
      )}
      {drawerOpen && (
        <DrawerModal
          spots={spots}
          onUnvisit={(id) => {
            const s = spots.find((x) => x.id === id);
            setConfirmState({
              title: "STAMP를 취소할까요?",
              message: `${s ? s.name : "이 도시"}의 STAMP를 취소해요.\n사진과 메모는 지워지지 않고, 다시 STAMP를 찍으면 그대로 보여요.`,
              confirmLabel: "STAMP 취소",
              onConfirm: () => unvisitSpot(id),
            });
          }}
          onStamp={(id) => setStampDateTarget({ spotId: id, mode: "stamp" })}
          onOpenStamp={(id) => setStampSpotId(id)}
          onExportBackup={exportBackup}
          onImportBackup={importBackup}
          lastBackupAt={lastBackupAt}
          backupNotice={backupNotice}
          onClose={() => {
            setDrawerOpen(false);
            setBackupNotice("");
          }}
        />
      )}
      {stampSpotId && spots.find((s) => s.id === stampSpotId) && (
        <StampDetailModal
          spot={spots.find((s) => s.id === stampSpotId)}
          onChangeMemo={(text) => updateSpotMemo(stampSpotId, text)}
          onChangePhoto={(slotIndex, file) => updateSpotPhoto(stampSpotId, slotIndex, file)}
          onRemovePhoto={(slotIndex) => removeSpotPhoto(stampSpotId, slotIndex)}
          onEditDate={() => setStampDateTarget({ spotId: stampSpotId, mode: "edit" })}
          onClose={() => setStampSpotId(null)}
        />
      )}
      {stampDateTarget && spots.find((s) => s.id === stampDateTarget.spotId) && (() => {
        const target = spots.find((s) => s.id === stampDateTarget.spotId);
        const isEdit = stampDateTarget.mode === "edit";
        return (
          <StampDateDialog
            spot={target}
            initialDate={isEdit ? target.visitedDate : null}
            title={isEdit ? "다녀온 날짜 수정" : "STAMP를 찍을까요?"}
            confirmLabel={isEdit ? "저장" : "STAMP"}
            onConfirm={(visitedDate) => {
              setStampDateTarget(null);
              if (isEdit) {
                updateSpotDate(target.id, visitedDate);
              } else {
                conquerSpot(target.id, visitedDate);
                setDrawerOpen(true);
              }
            }}
            onCancel={() => setStampDateTarget(null)}
          />
        );
      })()}
      {confirmState && (
        <ConfirmDialog
          {...confirmState}
          onConfirm={() => {
            const run = confirmState.onConfirm;
            setConfirmState(null);
            run();
          }}
          onCancel={() => setConfirmState(null)}
        />
      )}
      {birthModalOpen && (
        <BirthInfoModal
          initial={birthInfo}
          onSave={saveBirthInfo}
          onClose={() => setBirthModalOpen(false)}
        />
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<BaramApp />);

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
